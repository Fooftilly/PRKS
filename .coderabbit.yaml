# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US

tone_instructions: >-
  Be concise and evidence-based. Prioritize correctness, regressions, security,
  architecture, data integrity, and missing tests. Skip style-only nits unless
  they violate an explicit PRKS rule.

reviews:
  profile: assertive
  request_changes_workflow: false

  high_level_summary: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  poem: false
  enable_prompt_for_ai_agents: true

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false

  path_filters:
    - "!frontend/vendor/**"
    - "!docs/screenshots/**"
    - "!data/**"
    - "!data_testing/**"
    - "!artifacts/**"
    - "!**/*.zip"

  path_instructions:
    - path: "frontend/**"
      instructions: |
        Review user-visible changes against DESIGN.md.
        Check interaction consistency, accessibility, keyboard behavior,
        responsive behavior, modal lifecycle, workspace/tab semantics, and
        regressions in existing UI workflows. Do not invent new product
        behavior that is absent from the documented design or roadmap.

    - path: "frontend/sw.js"
      instructions: |
        Treat service-worker changes as high risk. Check cache versioning,
        activation/update behavior, offline correctness, stale-resource
        behavior, and recovery after upgrades. Cross-check
        docs/local-first-sync.md and relevant offline tests.

    - path: "backend/**/*sync*.py"
      instructions: |
        Review against the documented local-first and sync invariants.
        Check idempotency, revision/conflict semantics, atomicity, tombstones,
        partial failure behavior, and online/offline convergence.

    - path: "backend/db_*.py"
      instructions: |
        Treat database and migration changes as data-integrity sensitive.
        Verify migrations are transactional, version-ordered, safe for
        supported older databases, reject unsupported newer schemas where
        applicable, and are covered by migration/database tests.

    - path: "backend/**"
      instructions: |
        Prioritize correctness, data integrity, filesystem safety, concurrency,
        trust boundaries, SSRF/path handling, error handling, and durable
        writes. Follow AGENTS.md and SECURITY.md.

    - path: "tests/e2e/**"
      instructions: |
        Enforce the E2E policy in AGENTS.md. Flag arbitrary sleeps, shared
        mutable state, fixed ports, production-storage access, unnecessary
        full-suite iteration, vacuous assertions, weakened isolation, and
        browser-level tests where a fast unit/API/static test would adequately
        cover the behavior.

    - path: "docs/wiki/**"
      instructions: |
        Verify documentation matches implemented behavior. Keep README.md as
        the authority for exact startup, configuration, and safety contracts,
        and docs/wiki for detailed current user-facing behavior.

    - path: ".github/workflows/**"
      instructions: |
        Check least-privilege permissions, pinned actions, event safety,
        untrusted PR input handling, cache/artifact behavior, and whether a
        failure can accidentally be reported as success.

  pre_merge_checks:
    issue_assessment:
      mode: warning

    custom_checks:
      - name: "PRKS engineering invariants"
        mode: warning
        instructions: |
          Pass if the changed behavior does not conflict with an applicable
          explicit requirement in AGENTS.md. Fail only when a concrete changed
          behavior violates a specific repository rule, and identify that rule.

      - name: "UI design contract"
        mode: warning
        instructions: |
          For PRs with user-visible frontend changes, pass only if the changed
          interaction remains consistent with DESIGN.md and does not silently
          introduce a conflicting interaction model. For PRs without
          user-visible frontend changes, pass.

      - name: "Offline and sync coherence"
        mode: warning
        instructions: |
          For PRs that change offline, service-worker, persistence, or sync
          behavior, pass only if relevant online/offline transitions, recovery
          semantics, and regression coverage remain coherent with
          docs/local-first-sync.md and AGENTS.md. For unrelated PRs, pass.

  tools:
    github-checks:
      enabled: true
      timeout_ms: 900000

knowledge_base:
  opt_out: false

  web_search:
    enabled: true

  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "DESIGN.md"
      - "SECURITY.md"
      - "docs/local-first-sync.md"

  learnings:
    scope: local

  issues:
    scope: local

  pull_requests:
    scope: local
