# Build with pruning of replaced-tag leftovers: ./docker-build.sh
services:
  prks:
    build: .
    image: prks:latest
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${PRKS_PUBLISH_HOST:-127.0.0.1}:8080:8080"
    environment:
      PRKS_STORAGE: /data
      PRKS_PDF_LINEARIZE: "1"
      PRKS_TRUSTED_HOSTS: "${PRKS_TRUSTED_HOSTS:-}"
    volumes:
      - ./data:/data
    restart: unless-stopped
