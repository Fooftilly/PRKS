# SonarCloud analysis settings, read by the scanner in
# .github/workflows/sonarcloud.yml (CI-based analysis, #1373).
#
# Rules for editing:
# - Every file is either product code (sonar.sources) or test code
#   (sonar.tests), never both. Test code gets only Sonar's test rules, so
#   browser self-tests and fixtures stop failing the gate as product code.
# - sonar.exclusions is only for test code (kept out of sources) and for
#   vendored or generated files. Do not exclude backend/, frontend/js/,
#   frontend-app/src/ (except generated/), tools/ or scripts/.
# - Keep the vendored and generated paths in step with .codacy.yml.
# - Coverage is measured for backend/ + prks_app.py (coverage.py) and
#   frontend-app/src (Vitest). Everything else is excluded from coverage
#   only, so it is still analysed for bugs and smells.

sonar.projectKey=Fooftilly_PRKS
sonar.organization=fooftilly

sonar.sources=.
sonar.tests=.

sonar.test.inclusions=\
  tests/**,\
  frontend-app/**/*.test.ts,\
  frontend-app/**/*.test.mjs,\
  frontend-app/**/*.fixtures.ts,\
  frontend-app/**/test-support/**

sonar.exclusions=\
  tests/**,\
  frontend-app/**/*.test.ts,\
  frontend-app/**/*.test.mjs,\
  frontend-app/**/*.fixtures.ts,\
  frontend-app/**/test-support/**,\
  frontend/vendor/**,\
  frontend/vue/prks-vue.js,\
  frontend-app/src/api/generated/**

sonar.python.version=3.12

sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend-app/coverage/lcov.info
sonar.coverage.exclusions=\
  frontend/**,\
  scripts/**,\
  tools/**,\
  docs/**,\
  .github/**,\
  .claude/**,\
  frontend-app/*.ts,\
  frontend-app/*.js,\
  frontend-app/scripts/**,\
  frontend-app/.storybook/**,\
  frontend-app/**/*.stories.ts,\
  run_tests.py,\
  Dockerfile,\
  docker-entrypoint.sh,\
  docker-build.sh
