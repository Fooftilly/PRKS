# coverage.py settings for the SonarCloud workflow (#1373) only.
# Not named .coveragerc on purpose: the bounded coverage pilots keep their
# own defaults. Every Python process the test suites start (the unit runner,
# PostgreSQL helper modules, spawned servers) records data through the
# prks-coverage.pth hook the workflow installs, pointed here by
# COVERAGE_PROCESS_START.
[run]
branch = True
parallel = True
sigterm = True
# source_dirs + source_pkgs (not `source`) so the XML lists only the
# repository root and every filename is repository-relative; with `source`
# Sonar resolves prks_app.py under backend/ and drops it.
source_dirs = backend
source_pkgs = prks_app
data_file = ${PRKS_COVERAGE_DIR-.}/.coverage
relative_files = True

[report]
show_missing = False
skip_empty = True

[xml]
output = coverage.xml
