# SonarCloud automatic analysis settings (read from the default branch and PRs).
#
# Two rules are ignored in the Node browser self-tests under tests/browser only:
#
# - javascript:S1523 (dynamic code execution): each self-test loads the
#   classic frontend scripts into a `vm` context with vm.runInContext, which is
#   the harness itself, not untrusted input.
# - javascript:S2189 (loop variable never modified): the self-tests poll with
#   `for (...; !flag; ...) await setImmediate-tick`, where `flag` is set by a
#   callback while the loop awaits.
#
# Production code (frontend/, backend/, frontend-app/, tools/) keeps both rules.
sonar.issue.ignore.multicriteria=browserSelftestEval,browserSelftestAwaitLoop
sonar.issue.ignore.multicriteria.browserSelftestEval.ruleKey=javascript:S1523
sonar.issue.ignore.multicriteria.browserSelftestEval.resourceKey=tests/browser/**/*.js
sonar.issue.ignore.multicriteria.browserSelftestAwaitLoop.ruleKey=javascript:S2189
sonar.issue.ignore.multicriteria.browserSelftestAwaitLoop.resourceKey=tests/browser/**/*.js
