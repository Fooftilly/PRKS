# SonarCloud Automatic Analysis settings (read from the default branch).
# https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/automatic-analysis/
#
# Rules for editing:
# - Every file is either product code (sonar.sources) or test code
#   (sonar.tests), never both. Test code gets only Sonar's test rules, so
#   browser self-tests and fixtures stop failing the gate as product code.
# - sonar.exclusions is only for test code (kept out of sources) and for
#   vendored or generated files. Do not exclude backend/, frontend/js/,
#   frontend-app/src/ (except generated/), tools/ or scripts/.
# - Keep the vendored and generated paths in step with .codacy.yml.

sonar.sources=.
sonar.tests=.

sonar.test.inclusions=\
  tests/**,\
  frontend-app/**/*.test.ts,\
  frontend-app/**/*.test.mjs,\
  frontend-app/**/*.fixtures.ts,\
  frontend-app/**/test-support/**

sonar.exclusions=\
  tests/**,\
  frontend-app/**/*.test.ts,\
  frontend-app/**/*.test.mjs,\
  frontend-app/**/*.fixtures.ts,\
  frontend-app/**/test-support/**,\
  frontend/vendor/**,\
  frontend/vue/prks-vue.js,\
  frontend-app/src/api/generated/**

sonar.python.version=3.12
