<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#6d6cf7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>PRKS - Personal Research Knowledge System</title>
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/vendor/inter/inter.css">
    <!-- The id tells Cytoscape its container rule is already present (it is in
         style.css), so it does not inject a style element the CSP would refuse. -->
    <link rel="stylesheet" href="/css/style.css" id="__________cytoscape_stylesheet">
    <link rel="stylesheet" href="/vendor/easymde/easymde.min.css">
    <link rel="stylesheet" href="/vendor/codemirror/show-hint.css">
    <!-- CodeMirror lib must load before show-hint (addon needs global CodeMirror). EasyMDE bundles its own CM; we copy hint APIs onto that instance's constructor in works.js. -->
    <script src="/vendor/codemirror/codemirror.js"></script>
    <script src="/vendor/codemirror/show-hint.js"></script>
    <script src="/vendor/easymde/easymde.min.js"></script>
    <script src="/vendor/dompurify/purify.min.js"></script>
    <script src="/js/markdown-sanitize.js"></script>
</head>

<body>
    <!-- Vue app host (#230). Hidden bootstrap marker; performance diagnostics teleports into Settings. -->
    <div id="prks-vue-root" hidden></div>
    <div id="app-container">
        <!-- Sidebar and top ribbon hosts. Vue app-shell (#1038) paints them.
             Empty until the bundle mounts; there is no classic painter beside it. -->
        <nav id="sidebar"></nav>

        <!-- Main Content -->
        <main id="main-content">
            <div class="top-ribbon" id="prks-top-ribbon"></div>
            <div class="prks-workspace-tabs-shell">
                <div
                    id="prks-workspace-tabs"
                    class="prks-workspace-tabs"
                    role="tablist"
                    aria-label="Workspace tabs"
                ></div>
                    <button
                    type="button"
                    id="prks-workspace-overview-btn"
                    class="prks-icon-btn prks-icon-btn--ghost"
                    aria-label="Workspace overview"
                    title="Workspace overview"
                    aria-haspopup="dialog"
                    aria-expanded="false"
                ><span class="ribbon-btn__icon"><i data-lucide="layout-dashboard" class="prks-icon prks-icon--ribbon" aria-hidden="true"></i></span></button>
                <button
                    type="button"
                    id="prks-workspace-tab-overflow"
                    class="prks-icon-btn prks-icon-btn--ghost"
                    hidden
                    aria-label="More tabs"
                    title="More tabs"
                    aria-haspopup="menu"
                    aria-expanded="false"
                ><span class="ribbon-btn__icon"><i data-lucide="more-horizontal" class="prks-icon prks-icon--ribbon" aria-hidden="true"></i></span></button>
                    <button
                    type="button"
                    id="prks-workspace-tile-layout"
                    class="prks-icon-btn prks-icon-btn--ghost prks-workspace-split-btn"
                    aria-label="Open split view"
                    title="Open a page beside the Main tab"
                    aria-pressed="false"
                ><span class="ribbon-btn__icon"><i data-lucide="columns-2" class="prks-icon prks-icon--ribbon" aria-hidden="true"></i></span><span class="prks-workspace-split-btn__label">Split</span></button>
                <button
                    type="button"
                    id="prks-workspace-new-tab"
                    class="prks-icon-btn prks-icon-btn--ghost"
                    aria-label="Open a new tab"
                    title="Open a new tab"
                ><span class="ribbon-btn__icon"><i data-lucide="plus" class="prks-icon prks-icon--ribbon" aria-hidden="true"></i></span></button>
            </div>
            <p id="prks-workspace-status" class="prks-workspace-status meta-row" hidden aria-hidden="true"></p>
            <div id="prks-workspace-live" class="prks-sr-only" aria-live="polite"></div>
            <div id="page-content"></div>
            <div id="prks-tab-warm-parking" hidden aria-hidden="true"></div>
        </main>

        <!-- Right Panel (Details / Annotations) -->
        <aside id="right-panel">
            <button
                type="button"
                id="prks-right-panel-close"
                class="prks-icon-btn prks-icon-btn--ghost prks-right-panel-close"
                aria-label="Close details"
                title="Close details"
            ><i data-lucide="x" class="prks-icon prks-icon--ribbon" aria-hidden="true"></i></button>
            <div class="prks-tabs tabs">
                <button class="prks-tab tab-btn active is-active" data-target="details">Details</button>
                <button class="prks-tab tab-btn" data-target="annotations">Annotations</button>
            </div>
            <div class="tab-content" id="panel-content">
                <!-- Panel content dynamically fetched by app.js -->
            </div>
        </aside>
    </div>

    <!-- Drawer / panel overlay backdrop (mobile) -->
    <div id="prks-overlay-backdrop" class="prks-overlay-backdrop hidden" aria-hidden="true"></div>

    <!-- Modals -->
    <div id="modal-backdrop" class="modal-backdrop hidden"></div>

    <!-- Confirm, alert, prompt, and unsaved dismissal are painted by the Vue modal host. -->

    <div id="settings-modal" class="modal modal--settings hidden">
        <div class="modal-header">
            <h3>Settings</h3>
            <button class="prks-icon-btn close-btn" data-prks-action="modal-close">&times;</button>
        </div>
        <!-- Vue settings surface. This shell keeps open, close, Escape, and focus return. -->
        <div id="prks-settings-root"></div>
    </div>

    <!-- The "Replace library?" restore confirmation is rendered by the Vue
         modal host (SettingsDialogs.vue, #1036). -->

    <div id="master-add-modal" class="modal hidden">
        <div class="modal-header">
            <h3>Create New Entity</h3>
            <button class="prks-icon-btn close-btn" data-prks-action="modal-close">&times;</button>
        </div>
        <div class="modal-body modal-grid-2">
            <button type="button" data-prks-action="open-modal" data-prks-action-arg="folder-modal" class="prks-entity-choice"><i data-lucide="folder" class="prks-icon" aria-hidden="true"></i> New Folder</button>
            <button type="button" data-prks-action="open-modal" data-prks-action-arg="work-modal" class="prks-entity-choice"><i data-lucide="file-plus" class="prks-icon" aria-hidden="true"></i> New File</button>
            <button type="button" data-prks-action="open-modal" data-prks-action-arg="person-modal" class="prks-entity-choice"><i data-lucide="users" class="prks-icon" aria-hidden="true"></i> New Author</button>
            <button type="button" data-prks-action="open-modal" data-prks-action-arg="role-modal" class="prks-entity-choice"><i data-lucide="link" class="prks-icon" aria-hidden="true"></i> Link Person to Work</button>
        </div>
    </div>

    <!-- New File, Folder, Playlist, Saved View, Person Group, Person, the
         person template and Link Person to Work dialogs are rendered by the
         Vue modal host (ModalDialog.vue, #1036). -->

    <script src="/vendor/lucide/lucide.min.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/date-format.js"></script>
    <script src="/js/route-model.js"></script>
    <script src="/js/navigation.js"></script>
    <script src="/js/workspace-hosts.js"></script>
    <script src="/js/workspace-model.js"></script>
    <script src="/js/workspace-tree.js"></script>
    <script src="/js/workspace-persistence.js"></script>
    <script src="/js/workspace-tabs.js"></script>
    <script src="/js/owner-resource.js"></script>
    <script src="/js/tab-context.js"></script>
    <script src="/js/workspace-tiling.js"></script>
    <script src="/js/workspace-split.js"></script>
    <script src="/js/workspace-tab-menu.js"></script>
    <script src="/js/workspace-drag.js"></script>
    <script src="/js/workspace-overview.js"></script>
    <script src="/js/tab-leave.js"></script>
    <script src="/js/pdf-work-runtime.js"></script>
    <script src="/js/request-coordinator.js"></script>
    <script src="/js/browser-scope.js"></script>
    <script src="/js/sign-in.js"></script>
    <script src="/vendor/idb/idb.min.js"></script>
    <script src="/js/offline-store.js"></script>
    <script src="/js/offline-runtime.js"></script>
    <script src="/js/local-store.js"></script>
    <script src="/js/editor-recovery.js"></script>
    <script src="/js/work-tag-state.js"></script>
    <script src="/js/folder-tag-state.js"></script>
    <script src="/js/work-lifecycle-state.js"></script>
    <script src="/js/tag-vocabulary-state.js"></script>
    <script src="/js/folder-state.js"></script>
    <script src="/js/playlist-state.js"></script>
    <script src="/js/concept-state.js"></script>
    <script src="/js/position-state.js"></script>
    <script src="/js/argument-state.js"></script>
    <script src="/js/work-open-state.js"></script>
    <script src="/js/work-metadata-state.js"></script>
    <script src="/js/work-source-state.js"></script>
    <script src="/js/work-notes-state.js"></script>
    <script src="/js/work-note-recovery.js"></script>
    <script src="/js/work-role-state.js"></script>
    <script src="/js/pdf-annotation-state.js"></script>
    <script src="/js/pdf-annotation-reconcile.js"></script>
    <script src="/js/work-role-editor.js"></script>
    <script src="/js/person-state.js"></script>
    <script src="/js/person-metadata-state.js"></script>
    <script src="/js/person-group-state.js"></script>
    <script src="/js/sync-runtime.js"></script>
    <script src="/js/work-tag-editor.js"></script>
    <script src="/js/folder-tag-editor.js"></script>
    <script src="/js/work-metadata-editor.js"></script>
    <script src="/js/work-source-editor.js"></script>
    <script src="/js/sync-diagnostics.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/doc-types.js"></script>
    <script src="/js/overview-primitives.js"></script>
    <script src="/js/combobox-keys.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/components/work-cards.js"></script>
    <script src="/js/folder-hierarchy-nav.js"></script>
    <script src="/js/components/folders.js"></script>
    <script src="/js/research-links.js"></script>
    <script src="/js/components/works.js"></script>
    <script src="/js/components/concepts.js"></script>
    <script src="/js/components/positions.js"></script>
    <script src="/js/components/arguments.js"></script>
    <script src="/vendor/cytoscape/cytoscape.min.js"></script>
    <script src="/js/components/research-graph.js"></script>
    <script type="module" src="/js/components/works-pdf.js"></script>
    <script src="/js/components/playlists.js"></script>
    <script src="/js/components/people.js"></script>
    <script src="/js/components/people-groups.js"></script>
    <script src="/js/components/tags.js"></script>
    <script src="/js/components/types.js"></script>
    <script src="/js/work-selection.js"></script>
    <script src="/js/search-query-codec.js"></script>
    <script src="/js/command-palette.js"></script>
    <script src="/js/work-route-projection.js"></script>
    <script src="/js/app.js"></script>
    <script type="module" src="/vue/prks-vue.js"></script>
</body>

</html>
