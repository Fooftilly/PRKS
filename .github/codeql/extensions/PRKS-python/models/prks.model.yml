extensions:
  - addsTo:
      pack: codeql/python-all
      extensible: barrierModel
    data:
      # Logging/privacy sanitizers. These return bounded allowlisted labels or
      # canonical route templates and are covered by tests/test_logging_privacy.py.
      - ["backend.log_safety", "Member[safe_log_id].ReturnValue", "log-injection"]
      - ["backend.log_safety", "Member[safe_log_label].ReturnValue", "log-injection"]
      - ["backend.log_safety", "Member[safe_error_type].ReturnValue", "log-injection"]
      - ["backend.log_safety", "Member[safe_route].ReturnValue", "log-injection"]

      # Filesystem containment boundary. This helper returns None unless the
      # resolved candidate remains under the configured PDFs directory and is
      # covered by traversal/NUL-path regression tests.
      - ["backend.db_manager", "Member[safe_pdf_path_under_dir].ReturnValue", "path-injection"]
