version: 2

updates:
  # Python runtime and maintainer/browser-test dependencies.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "01:10"
      timezone: "Europe/Podgorica"
    open-pull-requests-limit: 4
    # Routine versions only; security patches are not delayed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"

  # Maintainer-only EmbedPDF build dependencies.
  - package-ecosystem: "npm"
    directory: "/tools/pdf-viewer"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "01:30"
      timezone: "Europe/Podgorica"
    open-pull-requests-limit: 3
    # Routine versions only; security patches are not delayed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    # React 19 needs a coordinated react + react-dom + types migration
    # (and EmbedPDF compatibility check). Keep 18.x patch/minor updates.
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
    groups:
      embedpdf:
        patterns:
          - "@embedpdf/*"
      react-stack:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

  # Maintainer-only Cytoscape.js research-graph build dependency.
  - package-ecosystem: "npm"
    directory: "/tools/research-graph"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "01:50"
      timezone: "Europe/Podgorica"
    open-pull-requests-limit: 3
    # Routine versions only; security patches are not delayed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"

  # Maintainer-only ordinary frontend vendor pins (DOMPurify, EasyMDE, CodeMirror, Lucide).
  - package-ecosystem: "npm"
    directory: "/tools/frontend-vendor"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:10"
      timezone: "Europe/Podgorica"
    open-pull-requests-limit: 3
    # Routine versions only; security patches are not delayed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    # PRKS consumes CodeMirror 5 (lib/codemirror.js + hint addons / global
    # CodeMirror). CM6 is a deliberate migration, not a Dependabot bump.
    # Keep 5.x patch/minor updates.
    ignore:
      - dependency-name: "codemirror"
        update-types: ["version-update:semver-major"]

  # Maintainer-only Vue 3 + Vite application build. Not a PRKS runtime dependency.
  - package-ecosystem: "npm"
    directory: "/frontend-app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:30"
      timezone: "Europe/Podgorica"
    open-pull-requests-limit: 3
    # Routine versions only; security patches are not delayed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    # Keep Storybook peer packages compatible in the same minor/patch update.
    groups:
      storybook-stack:
        applies-to: version-updates
        patterns:
          - "storybook"
          - "@storybook/*"
        # Include majors atomically, but leave them for explicit compatibility review.
      vitest-stack:
        applies-to: version-updates
        patterns:
          - "vitest"
          - "@vitest/*"
        # @vitest/coverage-v8 has an exact Vitest peer; all versions must move together.
      vite-toolchain:
        applies-to: version-updates
        patterns:
          - "vite"
          - "@vitejs/plugin-vue"
        update-types: ["minor", "patch"]

  # Keep the Python base image in the root Dockerfile visible to Dependabot.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:50"
      timezone: "Europe/Podgorica"
    open-pull-requests-limit: 2
    # Routine versions only; security patches are not delayed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"

  # Keep GitHub Actions used by CI and security workflows current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:10"
      timezone: "Europe/Podgorica"
    open-pull-requests-limit: 4
    # Routine versions only; security patches are not delayed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    groups:
      codeql-action:
        applies-to: version-updates
        patterns:
          - "github/codeql-action/*"
      codeql-security:
        applies-to: security-updates
        patterns:
          - "github/codeql-action/*"
