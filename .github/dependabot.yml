version: 2

# One weekly pull request for every version update (minor, patch and major)
# across all ecosystems below. Dependabot cannot rebuild the committed
# outputs (frontend bundles, manifests, sw.js DEPENDENCY_REVISION), so the
# batch is landed through one follow-up PR that carries the rebuild; a
# breaking major is reverted there and ignored here until it is migrated.
# Security updates still open their own pull requests.
multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "01:10"
      timezone: "Europe/Podgorica"
    commit-message:
      prefix: "build(deps)"

updates:
  # Python runtime and maintainer/browser-test dependencies.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    multi-ecosystem-group: "weekly-dependencies"
    patterns: ["*"]
    # Routine versions only; security patches are not delayed.
    cooldown:
      default-days: 7

  # Maintainer-only EmbedPDF build dependencies.
  - package-ecosystem: "npm"
    directory: "/tools/pdf-viewer"
    schedule:
      interval: "weekly"
    multi-ecosystem-group: "weekly-dependencies"
    patterns: ["*"]
    cooldown:
      default-days: 7
    # EmbedPDF 3.x is a re-architecture (headless kernel, renamed plugins,
    # no 3.x scroll/viewport/zoom yet) and the viewer patches are pinned to
    # 2.15.1: a deliberate migration, not a Dependabot bump.
    ignore:
      - dependency-name: "@embedpdf/*"
        update-types: ["version-update:semver-major"]

  # Maintainer-only Cytoscape.js research-graph build dependency.
  - package-ecosystem: "npm"
    directory: "/tools/research-graph"
    schedule:
      interval: "weekly"
    multi-ecosystem-group: "weekly-dependencies"
    patterns: ["*"]
    cooldown:
      default-days: 7

  # Maintainer-only ordinary frontend vendor pins (DOMPurify, EasyMDE, CodeMirror, Lucide).
  - package-ecosystem: "npm"
    directory: "/tools/frontend-vendor"
    schedule:
      interval: "weekly"
    multi-ecosystem-group: "weekly-dependencies"
    patterns: ["*"]
    cooldown:
      default-days: 7
    # PRKS consumes CodeMirror 5 (lib/codemirror.js + hint addons / global
    # CodeMirror). CM6 is a deliberate migration, not a Dependabot bump.
    ignore:
      - dependency-name: "codemirror"
        update-types: ["version-update:semver-major"]

  # Maintainer-only Vue 3 + Vite application build. Not a PRKS runtime dependency.
  - package-ecosystem: "npm"
    directory: "/frontend-app"
    schedule:
      interval: "weekly"
    multi-ecosystem-group: "weekly-dependencies"
    patterns: ["*"]
    cooldown:
      default-days: 7

  # Keep the Python base image in the root Dockerfile visible to Dependabot.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    multi-ecosystem-group: "weekly-dependencies"
    patterns: ["*"]
    cooldown:
      default-days: 7
    # Python 3.15 has no onnxruntime wheel (needed by PyMuPDF), and the
    # image's Python must match CI's python-version pins.
    ignore:
      - dependency-name: "python"
        versions: [">= 3.15"]

  # Keep GitHub Actions used by CI and security workflows current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    multi-ecosystem-group: "weekly-dependencies"
    patterns: ["*"]
    cooldown:
      default-days: 7
