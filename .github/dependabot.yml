version: 2

updates:
  # Python runtime and maintainer/browser-test dependencies.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build(deps)"

  # Maintainer-only EmbedPDF build dependencies.
  - package-ecosystem: "npm"
    directory: "/tools/pdf-viewer"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build(deps)"
    # React 19 needs a coordinated react + react-dom + types migration
    # (and EmbedPDF compatibility check). Keep 18.x patch/minor updates.
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
    groups:
      embedpdf:
        patterns:
          - "@embedpdf/*"
      react-stack:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"

  # Maintainer-only Cytoscape.js research-graph build dependency.
  - package-ecosystem: "npm"
    directory: "/tools/research-graph"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build(deps)"

  # Maintainer-only ordinary frontend vendor pins (DOMPurify, EasyMDE, CodeMirror, Lucide).
  - package-ecosystem: "npm"
    directory: "/tools/frontend-vendor"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build(deps)"
    # PRKS consumes CodeMirror 5 (lib/codemirror.js + hint addons / global
    # CodeMirror). CM6 is a deliberate migration, not a Dependabot bump.
    # Keep 5.x patch/minor updates.
    ignore:
      - dependency-name: "codemirror"
        update-types: ["version-update:semver-major"]

  # Keep the Python base image in the root Dockerfile visible to Dependabot.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build(deps)"

  # Keep GitHub Actions used by CI and security workflows current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build(deps)"
