name: E2E Offline Person Durability Profile

# Manual-only diagnostic under #740. Normal PR/master E2E costs are unchanged.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: e2e-person-durability-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  profile:
    name: Profile offline Person durability and dependencies
    runs-on: ubuntu-latest
    # Every E2E server runs PRKS_AUTH=loopback-owner on its own disposable
    # database of this PostgreSQL 18 server (tests/e2e/postgres_identity.py).
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PRKS_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .playwright-browsers
          key: >-
            playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt',
            'tests/e2e/install_browser.py') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install pinned runtime and E2E dependencies
        run: python scripts/ci/install_pinned_python.py e2e

      - name: Ensure Chromium in repo cache
        run: python tests/e2e/install_browser.py

      - name: Profile both isolated offline Person scenarios
        shell: bash
        env:
          PRKS_E2E_PROFILE: "1"
        run: |
          set -euo pipefail
          # Keep dispatch parameter-free; profile both cases on one runner.
          for SCENARIO in create edit; do
            case "$SCENARIO" in
            create) TARGET=tests.e2e.test_person_create_offline.OfflinePersonCreateTests.test_a_person_created_offline_can_be_linked_and_both_reach_the_server ;;
            edit) TARGET=tests.e2e.test_person_edit_offline.OfflinePersonEditTests.test_one_offline_creation_carries_two_unrelated_families_behind_it ;;
            *) echo "Unknown Person scenario: $SCENARIO" >&2; exit 2 ;;
          esac

          # One excluded warm-up per mode; paired trials alternate baseline
          # and trial-first on the same runner/SHA with fresh E2E isolation.
          for MODE in baseline trial; do
            PROBE=0
            if [ "$MODE" = trial ]; then PROBE=1; fi
            echo "::group::Person $SCENARIO $MODE warm-up"
            PRKS_E2E_PERSON_RECENT_TRIAL="$PROBE" PRKS_E2E_BENCHMARK_RESULT="" \
              python tests/e2e/run.py --jobs 1 --no-pointer-capture --profile "$TARGET"
            echo "::endgroup::"
          done
          for trial in 1 2 3; do
            for MODE in baseline trial; do
              PROBE=0
              if [ "$MODE" = trial ]; then PROBE=1; fi
              echo "::group::Person $SCENARIO $MODE trial $trial"
              result_file="$RUNNER_TEMP/person-$SCENARIO-$MODE-profile-$trial.json"
              rm -f "$result_file"
              PRKS_E2E_PERSON_RECENT_TRIAL="$PROBE" PRKS_E2E_BENCHMARK_RESULT="$result_file" \
                python tests/e2e/run.py --jobs 1 --no-pointer-capture --profile "$TARGET"
              echo "::endgroup::"
            done
          done
          done

          python - <<'PY'
          import json
          import math
          import os
          from pathlib import Path
          from statistics import median

          stage_sets = {
              "create": (
                  "person_create_setup", "person_create_warm_work",
                  "person_create_offline_create", "person_create_people_index",
                  "person_create_role_link",
                  "person_create_link_nav",
                  "person_create_link_nav_folders", "person_create_link_nav_recent",
                  "person_create_link_nav_recent_click", "person_create_link_nav_recent_card",
                  "person_create_link_nav_card_click", "person_create_link_nav_work_ready",
                  "person_create_link_panel",
                  "person_create_link_modal", "person_create_link_search",
                  "person_create_link_save", "person_create_dependency_check",
                  "person_create_offline_reload", "person_create_reconnect_settle",
                  "person_create_server_verify", "person_create_final_reload",
              ),
              "edit": (
                  "person_edit_setup", "person_edit_offline_create",
                  "person_edit_role_link",
                  "person_edit_link_nav",
                  "person_edit_link_nav_folders", "person_edit_link_nav_recent",
                  "person_edit_link_nav_recent_click", "person_edit_link_nav_recent_card",
                  "person_edit_link_nav_card_click", "person_edit_link_nav_work_ready",
                  "person_edit_link_panel",
                  "person_edit_link_modal", "person_edit_link_search",
                  "person_edit_link_save", "person_edit_profile_edit",
                  "person_edit_dependency_check", "person_edit_reconnect_settle",
                  "person_edit_server_verify",
              ),
          }
          root = Path(os.environ["RUNNER_TEMP"])
          for scenario, stages in stage_sets.items():
              compared = {}
              trial_key = f"person_{scenario}_link_nav_recent_trial"
              for mode in ("baseline", "trial"):
                  records = [
                      json.loads((root / f"person-{scenario}-{mode}-profile-{i}.json").read_text())
                      for i in (1, 2, 3)
                  ]
                  required = set(stages)
                  if mode == "trial":
                      required.add(trial_key)
                  for i, result in enumerate(records, 1):
                      if any(result.get(key) != expected for key, expected in (
                              ("tests", 1), ("failures", 0), ("errors", 0), ("skipped", 0))):
                          raise SystemExit(f"{scenario} {mode} trial {i}: not one passing test")
                      values = result.get("phase_seconds") or {}
                      missing = required - values.keys()
                      failed = [x for x in values if x.startswith(f"person_{scenario}_")
                                and x.endswith("_failed")]
                      bad = [x for x in required if x in values and (
                          not math.isfinite(float(values[x])) or float(values[x]) < 0)]
                      unexpected_trial = mode == "baseline" and trial_key in values
                      if missing or failed or bad or unexpected_trial:
                          raise SystemExit(
                              f"{scenario} {mode} trial {i}: missing={sorted(missing)}, "
                              f"failed={sorted(failed)}, invalid={bad}, "
                              f"unexpected_trial={unexpected_trial}"
                          )
                  compared[mode] = records
          
              def samples(mode, phase):
                  return [float(row["phase_seconds"][phase]) for row in compared[mode]]
          
              report = [
                  f"## Offline Person {scenario}: Recently Added actionability probe",
                  "",
                  "One excluded warm-up per mode; three paired passing fresh-storage "
                  "Chromium trials per mode, on the same checkout and runner.",
                  "Baseline is the normal click; trial-first adds Playwright "
                  "locator.click(trial=True) before the **same real click**.",
                  "A trial click checks actionability but does not dispatch the click. "
                  "It may scroll or warm readiness for the subsequent real click; "
                  "this is diagnostic, not a pure measure of page-handler cost.",
                  "All original user navigation, dependency, reload and server "
                  "assertions remain unchanged.",
                  "Children overlap their inclusive parent phases; do not sum them.",
                  "",
                  "| Phase | Baseline median (s) | Trial-first median (s) |",
                  "| --- | ---: | ---: |",
              ]
              for key in (*stages, trial_key):
                  baseline = (
                      f"{median(samples('baseline', key)):.3f}"
                      if key != trial_key else "—"
                  )
                  trial = f"{median(samples('trial', key)):.3f}"
                  report.append(f"| {chr(96)}{key}{chr(96)} | {baseline} | {trial} |")
              bclick = median(samples("baseline", f"person_{scenario}_link_nav_recent_click"))
              tclick = median(samples("trial", f"person_{scenario}_link_nav_recent_click"))
              tprobe = median(samples("trial", trial_key))
              bwall = median(float(row["wall_seconds"]) for row in compared["baseline"])
              twall = median(float(row["wall_seconds"]) for row in compared["trial"])
              report.extend([
                  "",
                  f"Baseline click median: **{bclick:.3f}s**; "
                  f"trial actionability median: **{tprobe:.3f}s**; "
                  f"post-trial real click median: **{tclick:.3f}s**.",
                  f"Whole-test median: baseline **{bwall:.3f}s**; "
                  f"trial-first **{twall:.3f}s**.",
                  "No causal speedup claim without actionability/handler timing proof. "
                  "No production, retries, assertion, timeout, or normal CI policy change.",
              ])
              output = "\n".join(report) + "\n"
              print(output)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
                  out.write(output)
          PY

      - name: Upload failure diagnostics only
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-person-profile-failure
          path: |
            .tests/e2e-failure-diagnostics.json
            .tests/e2e-last-failed.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
