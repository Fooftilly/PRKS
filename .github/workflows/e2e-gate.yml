name: PRKS Full E2E Gate

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: e2e-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-plan:
    permissions:
      contents: read
    name: E2E plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.plan.outputs.run }}
      mode: ${{ steps.plan.outputs.mode }}
      reason: ${{ steps.plan.outputs.reason }}
      features: ${{ steps.plan.outputs.features }}
      test_count: ${{ steps.plan.outputs.test_count }}
      pointer_capture: ${{ steps.plan.outputs.pointer_capture }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install plan-time dependencies
        # Playwright is importable for E2E discovery when mode=affected sizes shards.
        # Chromium itself is not downloaded here.
        run: >-
          python -m pip install --isolated --disable-pip-version-check
          "--only-binary=:all:" "playwright==1.63.0"

      - name: Resolve comparison base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
            echo "force=0" >> "$GITHUB_OUTPUT"
          else
            # master push + workflow_dispatch always run the complete Full E2E suite.
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "force=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide E2E gate mode
        id: plan
        shell: bash
        env:
          PRKS_E2E: "1"
        run: |
          set -euo pipefail
          if [[ "${{ steps.base.outputs.force }}" == "1" ]]; then
            export PRKS_E2E_CI_FORCE_FULL=1
            plan="$(python tests/e2e/run.py --ci-plan)"
          else
            base="${{ steps.base.outputs.ref }}"
            plan="$(python tests/e2e/run.py --ci-plan --base "$base")"
          fi
          echo "$plan"
          export PLAN_JSON="$plan"
          python <<'PY'
          import json
          import os

          plan = json.loads(os.environ["PLAN_JSON"])
          required = ("run", "mode", "features", "reason")
          missing = [k for k in required if k not in plan]
          if missing:
              raise SystemExit("malformed ci-plan missing keys: %s" % ", ".join(missing))
          mode = plan["mode"]
          if mode not in ("skip", "affected", "full"):
              raise SystemExit("malformed ci-plan mode: %r" % mode)
          if mode == "affected":
              features = plan.get("features") or []
              if not features:
                  raise SystemExit("affected plan must list features (fail closed)")
              count = plan.get("test_count")
              if not count:
                  raise SystemExit(
                      "affected plan selected zero/unknown tests (fail closed)"
                  )
          matrix = plan.get("matrix") or {}
          include = matrix.get("include") or []
          if plan.get("run") and mode != "skip" and not include:
              raise SystemExit("runnable plan missing matrix.include (fail closed)")
          run = "true" if plan.get("run") else "false"
          pointer = "true" if plan.get("pointer_capture") else "false"
          features_json = json.dumps(list(plan.get("features") or []), separators=(",", ":"))
          matrix_json = json.dumps({"include": include}, separators=(",", ":"))
          count = plan.get("test_count")
          count_s = "" if count is None else str(count)
          reason = plan["reason"].replace("\r", " ").replace("\n", " ").strip()
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as handle:
              handle.write("run=%s\n" % run)
              handle.write("mode=%s\n" % mode)
              handle.write("reason=%s\n" % reason)
              handle.write("features=%s\n" % features_json)
              handle.write("test_count=%s\n" % count_s)
              handle.write("pointer_capture=%s\n" % pointer)
              # Delimiter form so JSON braces/quotes cannot break the file syntax.
              handle.write("matrix<<EOF_MATRIX\n")
              handle.write("%s\n" % matrix_json)
              handle.write("EOF_MATRIX\n")
          print(
              "mode=%s run=%s features=%s test_count=%s shards=%d pointer=%s"
              % (
                  mode,
                  run,
                  features_json,
                  count_s or "-",
                  len(include),
                  pointer,
              )
          )
          PY

  e2e:
    permissions:
      contents: read
    name: E2E (${{ matrix.shard }}/${{ matrix.total }})
    needs: e2e-plan
    if: needs.e2e-plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    # FULL_GATE_EXTERNAL_SHARDS in tests/e2e/policy.py is the full-mode width.
    # Affected mode sizes matrix.include from selected test count via --ci-plan.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.e2e-plan.outputs.matrix) }}
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Cache Playwright Chromium
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: .playwright-browsers
          key: >-
            playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt',
            'tests/e2e/install_browser.py') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install runtime and E2E dependencies
        # Keep runtime pins in sync with requirements.txt. Playwright comes from
        # requirements-dev.txt. Explicit package== pins plus --only-binary satisfy
        # Sonar githubactions:S8541 / S8544; -r alone is treated as unlocked.
        run: >-
          python -m pip install --isolated --disable-pip-version-check
          "--only-binary=:all:" "PyMuPDF==1.28.2" "Pillow==12.3.0" "pydantic==2.13.5"
          "playwright==1.63.0"

      - name: Ensure Chromium in repo cache
        # install_browser.py reuses .playwright-browsers when the pin matches.
        run: python tests/e2e/install_browser.py

      - name: Run E2E selection shard
        env:
          PRKS_E2E_MODE: ${{ needs.e2e-plan.outputs.mode }}
          PRKS_E2E_FEATURES: ${{ needs.e2e-plan.outputs.features }}
        shell: bash
        run: |
          set -euo pipefail
          mode="${PRKS_E2E_MODE}"
          args=(python tests/e2e/run.py --jobs "${{ matrix.jobs }}" --no-pointer-capture)
          if [[ "${{ matrix.total }}" -gt 1 ]]; then
            args+=(--shard "${{ matrix.shard }}/${{ matrix.total }}")
          fi
          if [[ "$mode" == "affected" ]]; then
            mapfile -t features < <(python -c 'import json,os; print("\n".join(json.loads(os.environ["PRKS_E2E_FEATURES"])))')
            if [[ "${#features[@]}" -eq 0 ]]; then
              echo "::error::affected mode with empty features (fail closed)"
              exit 1
            fi
            for feature in "${features[@]}"; do
              args+=(--feature "$feature")
            done
          elif [[ "$mode" != "full" ]]; then
            echo "::error::unexpected E2E mode for matrix runner: $mode"
            exit 1
          fi
          printf 'Running:';
          printf ' %q' "${args[@]}"
          printf '\n'
          "${args[@]}"

      - name: Upload shard failure log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-shard-${{ matrix.shard }}-of-${{ matrix.total }}-log
          path: |
            .tests/
          if-no-files-found: ignore
          retention-days: 7

  e2e-pointer:
    permissions:
      contents: read
    name: E2E pointer capture
    # Parallel with the matrix: both depend only on e2e-plan (not on each other).
    needs: [e2e-plan]
    if: >-
      needs.e2e-plan.outputs.run == 'true'
      && needs.e2e-plan.outputs.pointer_capture == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Playwright Chromium
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: .playwright-browsers
          key: >-
            playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt',
            'tests/e2e/install_browser.py') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright
        run: >-
          python -m pip install --isolated --disable-pip-version-check
          "--only-binary=:all:" "playwright==1.63.0"

      - name: Install Chromium for pointer capture
        run: python tests/e2e/install_browser.py

      - name: Run pointer_capture once for the gate
        env:
          PRKS_E2E: "1"
        run: python tests/browser/pointer_capture.py

  e2e-result:
    permissions:
      contents: read
    name: Full E2E gate
    needs: [e2e-plan, e2e, e2e-pointer]
    # Skip when this workflow run was cancelled (concurrency cancel-in-progress
    # on a superseding push). otherwise always() still runs the aggregator with
    # needs.*.result == cancelled and falsely fails the required-check-shaped gate.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate shard outcomes
        shell: bash
        # Pass plan fields via env so filenames/JSON in reason/features never
        # become Bash source through ${{ }} interpolation inside run: scripts.
        env:
          PLAN_RUN: ${{ needs.e2e-plan.outputs.run }}
          PLAN_MODE: ${{ needs.e2e-plan.outputs.mode }}
          PLAN_REASON: ${{ needs.e2e-plan.outputs.reason }}
          PLAN_FEATURES: ${{ needs.e2e-plan.outputs.features }}
          PLAN_COUNT: ${{ needs.e2e-plan.outputs.test_count }}
          PLAN_POINTER: ${{ needs.e2e-plan.outputs.pointer_capture }}
          PLAN_RESULT: ${{ needs.e2e-plan.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          POINTER_RESULT: ${{ needs.e2e-pointer.result }}
        run: |
          set -euo pipefail
          plan_run="$PLAN_RUN"
          plan_mode="$PLAN_MODE"
          plan_reason="$PLAN_REASON"
          plan_features="$PLAN_FEATURES"
          plan_count="$PLAN_COUNT"
          plan_pointer="$PLAN_POINTER"
          plan_result="$PLAN_RESULT"
          e2e_result="$E2E_RESULT"
          pointer_result="$POINTER_RESULT"
          echo "e2e-plan: result=$plan_result run=$plan_run mode=$plan_mode"
          echo "features: $plan_features"
          echo "test_count: ${plan_count:-unknown}"
          echo "pointer_capture planned: $plan_pointer (parallel with matrix)"
          echo "reason: $plan_reason"
          echo "e2e matrix: $e2e_result"
          echo "pointer_capture: $pointer_result"
          if [[ "$plan_result" != "success" ]]; then
            echo "::error::E2E plan job failed"
            exit 1
          fi
          if [[ "$plan_run" != "true" || "$plan_mode" == "skip" ]]; then
            echo "E2E gate skipped (mode=skip; docs/unit/ignored-only or equivalent noop)"
            exit 0
          fi
          if [[ "$e2e_result" != "success" ]]; then
            echo "::error::One or more E2E shards failed (mode=$plan_mode matrix result=$e2e_result)"
            exit 1
          fi
          if [[ "$plan_pointer" == "true" ]]; then
            if [[ "$pointer_result" != "success" ]]; then
              echo "::error::E2E pointer_capture failed (result=$pointer_result)"
              exit 1
            fi
          else
            if [[ "$pointer_result" != "skipped" && "$pointer_result" != "success" ]]; then
              echo "::error::Unexpected pointer job result when not planned: $pointer_result"
              exit 1
            fi
          fi
          echo "E2E gate passed (mode=$plan_mode features=$plan_features count=${plan_count:-unknown} pointer=$plan_pointer parallel)"
