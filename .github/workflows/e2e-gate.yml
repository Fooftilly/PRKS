name: PRKS Full E2E Gate

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: e2e-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-plan:
    permissions:
      contents: read
    name: Full E2E plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Resolve comparison base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual runs always execute the full gate.
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "force=1" >> "$GITHUB_OUTPUT"
          else
            before="${{ github.event.before }}"
            if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
              echo "ref=" >> "$GITHUB_OUTPUT"
              echo "force=1" >> "$GITHUB_OUTPUT"
            elif git rev-parse --verify "${before}^{commit}" >/dev/null 2>&1; then
              echo "ref=$before" >> "$GITHUB_OUTPUT"
            else
              # Force-push / shallow history: before SHA is present but not
              # resolvable locally. Fail closed to the full gate (do not hand
              # an unusable base to --ci-plan, which must not exit 2 here).
              echo "ref=" >> "$GITHUB_OUTPUT"
              echo "force=1" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Decide whether full E2E is needed
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.base.outputs.force }}" == "1" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=workflow_dispatch or missing before SHA — running full E2E" >> "$GITHUB_OUTPUT"
            echo '{"run":true,"reason":"forced"}'
            exit 0
          fi
          base="${{ steps.base.outputs.ref }}"
          plan="$(python tests/e2e/run.py --ci-plan --base "$base")"
          echo "$plan"
          run="$(python -c 'import json,sys; print("true" if json.load(sys.stdin)["run"] else "false")' <<<"$plan")"
          reason="$(python -c 'import json,sys; print(json.load(sys.stdin)["reason"])' <<<"$plan")"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

  e2e:
    permissions:
      contents: read
    name: Full E2E (${{ matrix.shard }}/4)
    needs: e2e-plan
    if: needs.e2e-plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Prefer 4 GitHub runners × 1 local worker over 1 runner × 4 Chromium stacks.
    # FULL_GATE_EXTERNAL_SHARDS in tests/e2e/policy.py must stay in sync with
    # matrix.shard and the --shard TOTAL below.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install runtime and E2E dependencies
        # Keep runtime pins in sync with requirements.txt. Playwright comes from
        # requirements-dev.txt. Explicit package== pins plus --only-binary satisfy
        # Sonar githubactions:S8541 / S8544; -r alone is treated as unlocked.
        run: >-
          python -m pip install --isolated --disable-pip-version-check
          "--only-binary=:all:" "PyMuPDF==1.28.2" "Pillow==12.3.0" "pydantic==2.13.5"
          "playwright==1.63.0"

      - name: Run external E2E shard
        run: >-
          python tests/e2e/run.py --jobs 1 --shard ${{ matrix.shard }}/4
          --no-pointer-capture

      - name: Upload shard failure log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-shard-${{ matrix.shard }}-log
          path: |
            .tests/
          if-no-files-found: ignore
          retention-days: 7

  e2e-pointer:
    permissions:
      contents: read
    name: Full E2E pointer capture
    needs: [e2e-plan, e2e]
    if: needs.e2e-plan.outputs.run == 'true' && needs.e2e.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Playwright
        run: >-
          python -m pip install --isolated --disable-pip-version-check
          "--only-binary=:all:" "playwright==1.63.0"

      - name: Install Chromium for pointer capture
        run: python tests/e2e/install_browser.py

      - name: Run pointer_capture once for the full gate
        env:
          PRKS_E2E: "1"
        run: python tests/browser/pointer_capture.py

  e2e-result:
    permissions:
      contents: read
    name: Full E2E gate
    needs: [e2e-plan, e2e, e2e-pointer]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate shard outcomes
        shell: bash
        run: |
          set -euo pipefail
          plan_run="${{ needs.e2e-plan.outputs.run }}"
          plan_reason="${{ needs.e2e-plan.outputs.reason }}"
          plan_result="${{ needs.e2e-plan.result }}"
          e2e_result="${{ needs.e2e.result }}"
          pointer_result="${{ needs.e2e-pointer.result }}"
          echo "e2e-plan: result=$plan_result run=$plan_run"
          echo "reason: $plan_reason"
          echo "e2e matrix: $e2e_result"
          echo "pointer_capture: $pointer_result"
          if [[ "$plan_result" != "success" ]]; then
            echo "::error::Full E2E plan job failed"
            exit 1
          fi
          if [[ "$plan_run" != "true" ]]; then
            echo "Full E2E skipped (docs/unit/ignored-only or equivalent noop)"
            exit 0
          fi
          if [[ "$e2e_result" != "success" ]]; then
            echo "::error::One or more Full E2E shards failed (matrix result=$e2e_result)"
            exit 1
          fi
          if [[ "$pointer_result" != "success" ]]; then
            echo "::error::Full E2E pointer_capture failed (result=$pointer_result)"
            exit 1
          fi
          echo "Full E2E gate passed (4 runners × 1 worker + pointer_capture)"
