name: E2E Classic Script Coalescing A/B Benchmark

# Manual-only experiment. No committed frontend or ordinary E2E gate changes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-classic-bundle-ab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    name: Same-runner individual vs coalesced classic scripts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Cache Playwright Chromium
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: .playwright-browsers
          key: >-
            playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt',
            'tests/e2e/install_browser.py') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install runtime and E2E dependencies
        run: >-
          python -m pip install --isolated --disable-pip-version-check
          "--only-binary=:all:" "PyMuPDF==1.28.2" "Pillow==12.3.0" "pydantic==2.13.5"
          "playwright==1.63.0"

      - name: Ensure Chromium in repo cache
        run: python tests/e2e/install_browser.py

      - name: Run classic-script coalescing A/B
        env:
          PRKS_E2E_PROFILE: "1"
        run: python scripts/benchmark_classic_script_bundle.py --run
