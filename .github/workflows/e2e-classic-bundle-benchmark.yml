name: E2E Classic Script Coalescing A/B Benchmark

# Manual-only experiment. No committed frontend or ordinary E2E gate changes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-classic-bundle-ab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    name: Same-runner individual vs coalesced classic scripts
    runs-on: ubuntu-latest
    # Every E2E server runs PRKS_AUTH=loopback-owner on its own disposable
    # database of this PostgreSQL 18 server (tests/e2e/postgres_identity.py).
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PRKS_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .playwright-browsers
          key: >-
            playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt',
            'tests/e2e/install_browser.py') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install runtime and E2E dependencies
        run: python scripts/ci/install_pinned_python.py e2e

      - name: Ensure Chromium in repo cache
        run: python tests/e2e/install_browser.py

      - name: Run classic-script coalescing A/B
        env:
          PRKS_E2E_PROFILE: "1"
        run: python scripts/benchmark_classic_script_bundle.py --run
