name: E2E Classic Script Coalescing A/B Benchmark

# Manual-only experiment. No committed frontend or ordinary E2E gate changes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-classic-bundle-ab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    name: Same-runner individual vs coalesced classic scripts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .playwright-browsers
          key: >-
            playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt',
            'tests/e2e/install_browser.py') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install runtime and E2E dependencies
        run: python scripts/ci/install_pinned_python.py e2e

      - name: Ensure Chromium in repo cache
        run: python tests/e2e/install_browser.py

      - name: Run classic-script coalescing A/B
        env:
          PRKS_E2E_PROFILE: "1"
        run: python scripts/benchmark_classic_script_bundle.py --run
