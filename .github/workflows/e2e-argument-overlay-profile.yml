name: E2E Argument Overlay Phase Profile

# Manual-only diagnostic for issue #740; no PR/master automatic runner cost.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-argument-overlay-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  profile:
    name: Profile Argument rename propagation in real Chromium
    runs-on: ubuntu-latest
    # Every E2E server runs PRKS_AUTH=loopback-owner on its own disposable
    # database of this PostgreSQL 18 server (tests/e2e/postgres_identity.py).
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PRKS_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .playwright-browsers
          key: >-
            playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt',
            'tests/e2e/install_browser.py') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install pinned runtime and E2E dependencies
        run: python scripts/ci/install_pinned_python.py e2e

      - name: Ensure Chromium in repo cache
        run: python tests/e2e/install_browser.py

      - name: Profile isolated Argument rename and Graph propagation
        shell: bash
        env:
          PRKS_E2E_PROFILE: "1"
          TARGET: tests.e2e.test_arguments_durable.DurableArgumentTests.test_pending_rename_reaches_position_argument_picker_and_graph
        run: |
          set -euo pipefail
          # Exclude one warm-up, then profile three identical isolated runs.
          PRKS_E2E_BENCHMARK_RESULT="" \
            python tests/e2e/run.py --jobs 1 --no-pointer-capture --profile "$TARGET"

          for trial in 1 2 3; do
            echo "::group::Argument phase trial $trial"
            result_file="$RUNNER_TEMP/arg-overlay-profile-$trial.json"
            rm -f "$result_file"
            PRKS_E2E_BENCHMARK_RESULT="$result_file" \
              python tests/e2e/run.py --jobs 1 --no-pointer-capture --profile "$TARGET"
            echo "::endgroup::"
          done

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from statistics import median

          root = Path(os.environ["RUNNER_TEMP"])
          results = [json.loads((root / f"arg-overlay-profile-{i}.json").read_text())
                     for i in (1, 2, 3)]
          phases = (
              "arg_overlay_setup",
              "arg_overlay_warm_argument_details",
              "arg_overlay_warm_position",
              "arg_overlay_warm_graph",
              "arg_overlay_offline_rename",
              "arg_overlay_verify_position",
              "arg_overlay_verify_picker",
              "arg_overlay_verify_graph",
              "arg_overlay_verify_target",
              "arg_overlay_target_write",
              "arg_overlay_target_write_ops",
              "arg_overlay_target_write_base",
              "arg_overlay_target_write_revision_read",
              "arg_overlay_target_write_record_read",
              "arg_overlay_target_write_enqueue",
              "arg_overlay_target_render",
              "arg_overlay_target_visible",
              "arg_overlay_verify_response",
              "arg_overlay_response_write",
              "arg_overlay_response_write_ops",
              "arg_overlay_response_write_base",
              "arg_overlay_response_write_revision_read",
              "arg_overlay_response_write_record_read",
              "arg_overlay_response_write_enqueue",
              "arg_overlay_response_render",
              "arg_overlay_response_visible",
          )
          for i, result in enumerate(results, 1):
              if any(result.get(k) != n for k, n in (
                      ("tests", 1), ("failures", 0), ("errors", 0), ("skipped", 0))):
                  raise SystemExit(f"Trial {i} did not execute exactly one passing browser test")
              values = result.get("phase_seconds", {})
              missing = set(phases) - values.keys()
              failures = [key for key in values if key.startswith("arg_overlay_")
                          and key.endswith("_failed")]
              if missing or failures:
                  raise SystemExit(
                      f"Trial {i}: missing phases {sorted(missing)}, failed {failures}"
                  )
          summary = [
              "## Offline Argument name propagation: three measured trials",
              "",
              "One excluded warm-up; three passing Chromium runs using fresh test storage",
              "and browser contexts. Most phases are sequential; the target",
              "and response write/render/visible steps are NESTED inside their",
              "respective verification totals. Render includes route navigation",
              "and awaited detail paint. Each write includes operations, base",
              "and enqueue; each base includes revision/entity cache reads.",
              "These are overlapping NESTED timers: never add parents to children.",
              "Generic infrastructure and async-wait totals may overlap them.",
              "",
              "| Phase | Median (s) | Trials (s) |",
              "| --- | ---: | --- |",
          ]
          for key in phases:
              values = [float(r["phase_seconds"][key]) for r in results]
              summary.append(
                  f"| `{key}` | {median(values):.3f} | "
                  + ", ".join(f"{v:.3f}" for v in values) + " |"
              )
          walls = [float(r["wall_seconds"]) for r in results]
          summary.extend((
              "",
              f"Single-test wall median: **{median(walls):.3f}s**.",
              "Do not compare profiled and unprofiled CI as equivalent samples.",
              "Use these measurements for a separate guarded same-runner A/B "
              "before changing application behavior or test assertions.",
          ))
          text = "\n".join(summary) + "\n"
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(text)
          PY

      - name: Upload failure diagnosis only
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: argument-overlay-profile-failure
          path: |
            .tests/e2e-failure-diagnostics.json
            .tests/e2e-last-failed.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
