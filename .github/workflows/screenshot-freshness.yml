name: Screenshot Freshness

on:
  pull_request:
    branches: [master]
    paths:
      - "frontend/**"
      - "backend/db_manager.py"
      - "backend/research_graph.py"
      - "backend/research_network.py"
      - "backend/server.py"
      - "backend/services/work_pdf_replace.py"
      - "requirements-dev.txt"
      - "scripts/capture_demo_screenshots.py"
      - "scripts/seed_demo_library.py"
      - "scripts/update_demo_screenshots.py"
      - "scripts/check_screenshot_freshness.py"
      - "tests/e2e/install_browser.py"
      - "docs/screenshots/**"
      - "DESIGN.md"
      - ".github/workflows/screenshot-freshness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check screenshot freshness
        run: python3 scripts/check_screenshot_freshness.py
