name: Docker runtime startup smoke

# Non-required, dependency/runtime-scoped production image test (#339).
# The repository's required PR checks remain unchanged.
on:
  pull_request:
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - docker-compose.yml
      - requirements.txt
      - dependency-inventory.json
      - backend/dependency_gate.py
      - backend/storage/config.py
      - backend/storage/resolver.py
      - backend/storage/root_binding.py
      - prks_app.py
      - scripts/ci/check_runtime_smoke.py
      - tests/test_docker_runtime_smoke.py
      - frontend/index.html
      - frontend/sw.js
      - frontend/vue/prks-vue.js
      - scripts/build_classic_distribution.py
      - .github/workflows/docker-runtime-smoke.yml
  push:
    branches:
      - master
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - docker-compose.yml
      - requirements.txt
      - dependency-inventory.json
      - backend/dependency_gate.py
      - backend/storage/config.py
      - backend/storage/resolver.py
      - backend/storage/root_binding.py
      - prks_app.py
      - scripts/ci/check_runtime_smoke.py
      - tests/test_docker_runtime_smoke.py
      - frontend/index.html
      - frontend/sw.js
      - frontend/vue/prks-vue.js
      - scripts/build_classic_distribution.py
      - .github/workflows/docker-runtime-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-runtime-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Docker runtime startup and API smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build production runtime image
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag prks-ci-runtime-smoke:latest .

      - name: Start production image and validate application API
        shell: bash
        run: |
          set -euo pipefail
          container="prks-runtime-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          database="${container}-db"
          network="${container}-net"
          response="$(mktemp)"
          html="$(mktemp)"
          asset="$(mktemp)"
          jar="$(mktemp)"
          cleanup() {
            rc=$?
            if [[ "$rc" -ne 0 ]]; then
              echo "::error::Production runtime startup / API smoke failed (exit ${rc})."
              docker logs --tail 120 "$container" 2>&1 || true
              docker inspect --format 'Container status: {{.State.Status}}; exit code: {{.State.ExitCode}}' "$container" 2>&1 || true
            fi
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker rm -f "$database" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
            rm -f "$response" "$html" "$asset" "$jar"
          }
          trap cleanup EXIT

          # PostgreSQL is the only Library backend (PG-C2 #641): a volatile
          # PostgreSQL 18 on a private network, reachable only by the image.
          docker network create "$network" >/dev/null
          db_password="$(openssl rand -hex 32)"
          docker run -d --name "$database" --network "$network" --network-alias db \
            --env POSTGRES_DB=prks --env POSTGRES_USER=prks --env POSTGRES_PASSWORD="$db_password" \
            --env POSTGRES_INITDB_ARGS="--locale-provider=builtin --builtin-locale=PG_UNICODE_FAST" \
            --tmpfs /var/lib/postgresql:rw,size=256m \
            postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336 >/dev/null
          for attempt in $(seq 1 60); do
            if docker exec "$database" pg_isready -h 127.0.0.1 -U prks -d prks >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" -eq 60 ]]; then
              echo "::error::PostgreSQL did not become ready."
              exit 1
            fi
            sleep 1
          done

          # Volatile isolated data; no host-mounted database or persistent secrets.
          # Publish only to loopback on the isolated GitHub-hosted runner.
          docker run -d --name "$container" --network "$network" --publish 127.0.0.1:18080:8080 \
            --user 1000:1000 \
            --tmpfs /data:rw,size=128m,uid=1000,gid=1000 \
            --env PRKS_STORAGE=/data --env PRKS_PDF_LINEARIZE=1 \
            --env PRKS_DATABASE_URL="postgresql://prks:${db_password}@db:5432/prks" \
            prks-ci-runtime-smoke:latest

          # First run: the web process applies the schema, binds the new root
          # and waits for setup. Set up an owner as an operator would.
          for attempt in $(seq 1 60); do
            if ! docker inspect --format '{{.State.Running}}' "$container" | grep -qx true; then
              echo "::error::Production container exited before binding its root (attempt ${attempt}/60)."
              exit 1
            fi
            if docker exec "$container" test -f /data/prks-root.json; then
              break
            fi
            if [[ "$attempt" -eq 60 ]]; then
              echo "::error::Production container never bound its data root."
              exit 1
            fi
            sleep 1
          done
          owner_password="owner-$(openssl rand -hex 16)"
          openssl rand -hex 32 | docker exec -i "$container" sh -c 'umask 077; cat > /tmp/bootstrap-token'
          printf '%s' "$owner_password" | docker exec -i "$container" sh -c 'umask 077; cat > /tmp/owner-password'
          admin=(docker exec --env PRKS_BOOTSTRAP_TOKEN_FILE=/tmp/bootstrap-token "$container"
                 python /app/prks_app.py admin bootstrap)
          "${admin[@]}" issue-token --root /data
          "${admin[@]}" complete --root /data --login owner --password-file /tmp/owner-password

          ready=0
          for attempt in $(seq 1 60); do
            if ! docker inspect --format '{{.State.Running}}' "$container" | grep -qx true; then
              echo "::error::Production container exited before API readiness on attempt ${attempt}/60."
              exit 1
            fi
            if curl --silent --fail --max-time 2 --output /dev/null http://127.0.0.1:18080/readyz \
              && curl --silent --show-error --fail --max-time 5 --output /dev/null \
                --cookie-jar "$jar" --header 'Content-Type: application/json' \
                --header 'Origin: http://127.0.0.1:18080' \
                --data "{\"login\": \"owner\", \"password\": \"${owner_password}\"}" \
                http://127.0.0.1:18080/api/login \
              && status=$(curl --silent --show-error --fail --max-time 2 --cookie "$jar" \
              --write-out '%{http_code}' --output "$response" \
              http://127.0.0.1:18080/api/works 2>/dev/null) \
              && [[ "$status" == "200" ]]; then
              # A fresh production Library must expose an empty works
              # catalogue. A static page or error JSON is NOT sufficient.
              python scripts/ci/check_runtime_smoke.py < "$response"
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" -ne 1 ]]; then
            echo "::error::Production API did not become ready in 60 attempts."
            exit 1
          fi

          # Verify the real production server also serves generated frontend,
          # rather than passing from an unrelated container or static mock.
          curl --fail --silent --show-error --max-time 5 \
            --output "$html" http://127.0.0.1:18080/index.html
          grep -q 'prks-classic-head.bundle.js' "$html"
          grep -q 'prks-classic-body.bundle.js' "$html"
          # Check a real executable script element, not a string in an HTML
          # comment, template, or other inert markup.
          python scripts/ci/check_runtime_smoke.py --html < "$html"

          # A missing static JS path can return index.html with HTTP 200.
          # Compare *all* bytes served over HTTP against the corresponding
          # generated file inside this very production image. MIME/markers alone
          # would accept a prefix truncated after the first source comment.
          for bundle in prks-classic-head.bundle.js prks-classic-body.bundle.js; do
            expected_sha="$(docker exec "$container" python -c \
              'import hashlib,sys; from pathlib import Path; print(hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest())' \
              "/app/frontend/js/${bundle}")"
            mime="$(curl --fail --silent --show-error --max-time 5 \
              --write-out '%{content_type}' --output "$asset" \
              "http://127.0.0.1:18080/js/${bundle}")"
            python scripts/ci/check_runtime_smoke.py \
              --asset bundle "$mime" "$expected_sha" < "$asset"
          done
          # Vue is shipped separately from the classic bundles. Confirm the
          # HTTP asset matches the actual Vue build bytes inside this image.
          expected_sha="$(docker exec "$container" python -c \
            'import hashlib,sys; from pathlib import Path; print(hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest())' \
            /app/frontend/vue/prks-vue.js)"
          mime="$(curl --fail --silent --show-error --max-time 5 \
            --write-out '%{content_type}' --output "$asset" \
            http://127.0.0.1:18080/vue/prks-vue.js)"
          python scripts/ci/check_runtime_smoke.py \
            --asset vue "$mime" "$expected_sha" < "$asset"
          expected_sha="$(docker exec "$container" python -c \
            'import hashlib,sys; from pathlib import Path; print(hashlib.sha256(Path(sys.argv[1]).read_bytes()).hexdigest())' \
            /app/frontend/sw.js)"
          mime="$(curl --fail --silent --show-error --max-time 5 \
            --write-out '%{content_type}' --output "$asset" \
            http://127.0.0.1:18080/sw.js)"
          python scripts/ci/check_runtime_smoke.py \
            --asset worker "$mime" "$expected_sha" < "$asset"
          echo "Production Docker startup, works API, byte-matched JS bundles and service worker: PASS"
