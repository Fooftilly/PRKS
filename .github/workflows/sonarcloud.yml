name: SonarCloud

# CI-based SonarCloud analysis with coverage (#1373). Not a required check.
# The coverage jobs rerun the unchanged Test Gate commands (`python
# run_tests.py`, `scripts/test-postgres`, Vitest) under coverage.py / V8, in
# parallel with the Test Gate, so the required gate keeps its speed and its
# pinned commands. Only the final scan job sees SONAR_TOKEN; test code never
# runs with it. Fork PRs have no secret, so the scan is skipped there.
on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-unit-coverage:
    name: Coverage - unit, API, structural tests
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install pinned runtime, test and coverage dependencies
        run: python scripts/ci/install_pinned_python.py coverage

      - name: Install the coverage start-up hook
        run: python scripts/ci/sonar_coverage_hook.py install

      - name: Run the unit suite under coverage
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/scripts/ci/sonar-coverage.ini
          PRKS_COVERAGE_DIR: ${{ runner.temp }}/prks-coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PRKS_COVERAGE_DIR"
          python run_tests.py

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-coverage-unit
          path: ${{ runner.temp }}/prks-coverage/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  postgres-coverage:
    name: Coverage - PostgreSQL helpers (${{ matrix.shard }}/4)
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Same disposable PostgreSQL 18 as the Test Gate's helper shards.
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned runtime, test and coverage dependencies
        run: python scripts/ci/install_pinned_python.py coverage

      - name: Install qpdf for real linearization tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qpdf

      - name: Install the coverage start-up hook
        run: python scripts/ci/sonar_coverage_hook.py install

      - name: Run PostgreSQL helper tests under coverage
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/scripts/ci/sonar-coverage.ini
          PRKS_COVERAGE_DIR: ${{ runner.temp }}/prks-coverage
          PRKS_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          PRKS_PG_SHARD: ${{ matrix.shard }}/4
          PYTHON: python
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PRKS_COVERAGE_DIR"
          scripts/test-postgres

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-coverage-pg-${{ matrix.shard }}
          path: ${{ runner.temp }}/prks-coverage/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  vitest-coverage:
    name: Coverage - Vitest
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=24.15.0 <25"
          cache: npm
          cache-dependency-path: frontend-app/package-lock.json

      - name: Install locked frontend toolchain
        run: npm ci --ignore-scripts --no-audit --prefix frontend-app

      - name: Run Vitest with V8 coverage
        working-directory: frontend-app
        shell: bash
        run: |
          set -euo pipefail
          npm exec -- vitest run \
            --coverage.enabled \
            --coverage.provider=v8 \
            --coverage.include='src/**/*.{ts,vue}' \
            --coverage.exclude='src/api/generated/**' \
            --coverage.exclude='src/**/*.test.ts' \
            --coverage.exclude='src/**/*.fixtures.ts' \
            --coverage.exclude='src/**/test-support/**' \
            --coverage.exclude='src/**/*.stories.ts' \
            --coverage.reporter=lcov \
            --coverage.reportsDirectory=coverage
          # Sonar resolves LCOV paths from the repository root.
          sed -E -i 's#^SF:(\./)?([^/])#SF:frontend-app/\2#' coverage/lcov.info
          grep -c '^SF:frontend-app/src/' coverage/lcov.info

      - name: Upload LCOV report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-coverage-vitest
          path: frontend-app/coverage/lcov.info
          if-no-files-found: error
          retention-days: 3

  scan:
    name: SonarCloud scan
    needs: [python-unit-coverage, postgres-coverage, vitest-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: Sonar needs blame to find new code.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned coverage.py
        run: >-
          python -m pip install --isolated --disable-pip-version-check
          --no-input "--only-binary=:all:" "coverage==7.16.2"

      - name: Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sonar-coverage-*
          path: ${{ runner.temp }}/sonar-coverage

      - name: Combine Python coverage and place the LCOV report
        env:
          COVERAGE_ROOT: ${{ runner.temp }}/sonar-coverage
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t data < <(find "$COVERAGE_ROOT" -name '.coverage.*' -type f)
          if [[ "${#data[@]}" -eq 0 ]]; then
            echo "::error::No Python coverage data was uploaded."
            exit 1
          fi
          python -m coverage combine --rcfile=scripts/ci/sonar-coverage.ini --data-file=.coverage "${data[@]}"
          python -m coverage xml --rcfile=scripts/ci/sonar-coverage.ini --data-file=.coverage -o coverage.xml
          python -m coverage report --rcfile=scripts/ci/sonar-coverage.ini --data-file=.coverage --format=total
          mkdir -p frontend-app/coverage
          cp "$COVERAGE_ROOT/sonar-coverage-vitest/lcov.info" frontend-app/coverage/lcov.info

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
