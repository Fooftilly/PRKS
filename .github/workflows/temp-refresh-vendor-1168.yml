name: Temporary Lucide dependency artifact refresh
on:
  push:
    branches:
      - 'dependabot/npm_and_yarn/tools/frontend-vendor/frontend-vendor-routine-4f176937c8'
permissions:
  contents: write
jobs:
  refresh:
    if: github.ref == 'refs/heads/dependabot/npm_and_yarn/tools/frontend-vendor/frontend-vendor-routine-4f176937c8'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout dependency branch without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Regenerate and validate vendor artifacts
        run: bash scripts/refresh_dependency_artifacts.sh frontend-vendor
      - name: Commit refreshed vendor files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- frontend/vendor/lucide frontend/vendor/DEPENDENCY-MANIFEST.json frontend/sw.js
          if git diff --cached --quiet; then
            echo "No updated vendor artifacts"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(deps): regenerate Lucide artifacts on current master'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:${GITHUB_REF_NAME}"
