name: E2E Flake Acceptance Stress

# Opt-in 20x acceptance for #456, #457, #458. One automatic validation
# when this workflow itself changes; no extra matrix on ordinary PRs/master.
on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "Consecutive fresh targeted E2E runs per case (normally 20)"
        type: number
        required: true
        default: 20
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/e2e-flake-stress.yml

permissions:
  contents: read

concurrency:
  group: e2e-flake-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stress:
    name: Stress ${{ matrix.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: divider-network-456
            test_id: tests.e2e.test_app.MainSecondaryDividerTests.test_divider_drag_causes_no_additional_route_or_pdf_requests
          - case: recent-cache-457
            test_id: tests.e2e.test_browse_offline.BrowseOfflineTests.test_display_changes_stale_all_three_projections
          - case: settings-narrow-458
            test_id: tests.e2e.test_app.SettingsCategoryWorkflowTests.test_responsive_narrow_category_strip
          - case: settings-viewport-458
            test_id: tests.e2e.test_app.SettingsCategoryWorkflowTests.test_nav_orientation_updates_on_runtime_viewport_transition
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Cache Playwright Chromium
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: .playwright-browsers
          key: >-
            playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt',
            'tests/e2e/install_browser.py') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install runtime and E2E dependencies
        run: >-
          python -m pip install --isolated --disable-pip-version-check
          "--only-binary=:all:" "PyMuPDF==1.28.2" "Pillow==12.3.0" "pydantic==2.13.5"
          "playwright==1.63.0"

      - name: Ensure Chromium in repo cache
        run: python tests/e2e/install_browser.py

      - name: Run consecutive isolated targeted tests (no retries)
        shell: bash
        env:
          PRKS_E2E_TEST_ID: ${{ matrix.test_id }}
          # format() converts numeric zero to the nonempty string '0' so the
          # shell rejects it instead of the || fallback silently choosing 20.
          PRKS_E2E_STRESS_ITERATIONS: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.iterations) || '20' }}
          # PR runs check out a synthetic merge commit. Preserve both real
          # parents for auditable 20/20 evidence even after that ref expires.
          PRKS_E2E_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          PRKS_E2E_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$PRKS_E2E_STRESS_ITERATIONS" =~ ^[0-9]+$ ]] ||
             (( PRKS_E2E_STRESS_ITERATIONS < 1 || PRKS_E2E_STRESS_ITERATIONS > 100 )); then
            echo "::error::iterations must be an integer from 1 to 100"
            exit 1
          fi
          echo "Case: $PRKS_E2E_TEST_ID (iterations: $PRKS_E2E_STRESS_ITERATIONS)"
          echo "Tested code: base $PRKS_E2E_BASE_SHA, head $PRKS_E2E_HEAD_SHA, checkout $GITHUB_SHA"
          printf 'Tested code: base %s, head %s, checkout %s\n' \
            "$PRKS_E2E_BASE_SHA" "$PRKS_E2E_HEAD_SHA" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          for ((i=1; i<=PRKS_E2E_STRESS_ITERATIONS; i++)); do
            printf '\n=== targeted iteration %d/%d ===\n' "$i" "$PRKS_E2E_STRESS_ITERATIONS"
            if ! python tests/e2e/run.py --jobs 1 --no-pointer-capture "$PRKS_E2E_TEST_ID"; then
              echo "::error::${PRKS_E2E_TEST_ID} failed on iteration ${i}/${PRKS_E2E_STRESS_ITERATIONS}"
              echo "FAILED ${PRKS_E2E_TEST_ID}: ${i}/${PRKS_E2E_STRESS_ITERATIONS}" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
          echo "PASS: ${PRKS_E2E_TEST_ID}, ${PRKS_E2E_STRESS_ITERATIONS}/${PRKS_E2E_STRESS_ITERATIONS} consecutive targeted runs" | tee -a "$GITHUB_STEP_SUMMARY"

  negative-control:
    name: Divider drag reload must fail the oracle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Cache Playwright Chromium
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: .playwright-browsers
          key: >-
            playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt',
            'tests/e2e/install_browser.py') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install runtime and E2E dependencies
        run: >-
          python -m pip install --isolated --disable-pip-version-check
          "--only-binary=:all:" "PyMuPDF==1.28.2" "Pillow==12.3.0" "pydantic==2.13.5"
          "playwright==1.63.0"

      - name: Ensure Chromium in repo cache
        run: python tests/e2e/install_browser.py

      - name: Inject a drag-initiated GET in the runner's temporary test copy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/e2e/test_app.py")
          source = path.read_text(encoding="utf-8")
          anchor = '        phase = "drag"\n\n        _drag_divider(page, 150)\n'
          if source.count(anchor) != 1:
              raise SystemExit("Divider test anchor changed: negative control must fail closed")
          injection = (
              '        phase = "drag"\n\n'
              '        # Deliberately broken behavior, injected ONLY in this runner.\n'
              '        page.evaluate("""() => {\n'
              '            window.addEventListener(\'pointermove\', function onMove(event) {\n'
              '                if ((event.buttons & 1) === 0) return;\n'
              '                window.removeEventListener(\'pointermove\', onMove, true);\n'
              '                void fetch(\'/api/works/PRKS_DIVIDER_NEGATIVE_CONTROL\');\n'
              '            }, true);\n'
              '        }""")\n\n'
              '        _drag_divider(page, 150)\n'
          )
          path.write_text(source.replace(anchor, injection), encoding="utf-8")
          PY

      - name: Verify the unchanged divider assertion rejects the reload
        shell: bash
        env:
          PRKS_E2E_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          PRKS_E2E_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          target=tests.e2e.test_app.MainSecondaryDividerTests.test_divider_drag_causes_no_additional_route_or_pdf_requests
          if python tests/e2e/run.py --jobs 1 --no-pointer-capture "$target" > negative-control.log 2>&1; then
            cat negative-control.log
            echo "::error::The divider regression oracle accepted a deliberate drag-triggered GET"
            exit 1
          fi
          cat negative-control.log
          # Failing for an unrelated timeout/setup error is not a valid
          # negative control. Verify the exact unexpected GET and phase delta.
          if ! grep -Fq 'divider drags must not initiate Work/PDF reloads' negative-control.log ||
             ! grep -Fq '/api/works/PRKS_DIVIDER_NEGATIVE_CONTROL' negative-control.log ||
             ! grep -Fq 'after_barrier_ms' negative-control.log; then
            echo "::error::The test failed for a reason other than the injected post-barrier GET"
            exit 1
          fi
          printf 'PASS (expected rejection): %s\n' "$target" >> "$GITHUB_STEP_SUMMARY"
          printf 'Tested code: base %s, head %s, checkout %s\n' \
            "$PRKS_E2E_BASE_SHA" "$PRKS_E2E_HEAD_SHA" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Negative control correctly rejected the deliberate drag-triggered Work GET'
