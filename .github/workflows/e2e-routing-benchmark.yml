name: E2E Routing A/B Benchmark

# This is strictly diagnostic; it never runs on PRs or master pushes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-routing-ab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    name: Same-runner baseline vs fast path
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Cache Playwright Chromium
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: .playwright-browsers
          key: >-
            playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt',
            'tests/e2e/install_browser.py') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install runtime and E2E dependencies
        # Same pinned runtime packages as the authoritative E2E gate.
        run: >-
          python -m pip install --isolated --disable-pip-version-check
          "--only-binary=:all:" "PyMuPDF==1.28.2" "Pillow==12.3.0" "pydantic==2.13.5"
          "playwright==1.63.0"

      - name: Ensure Chromium in repo cache
        run: python tests/e2e/install_browser.py

      - name: Run alternating A/B trials
        shell: bash
        env:
          PRKS_E2E_PROFILE: "1"
        run: |
          set -euo pipefail
          # Warm Python import/bytecode and first Chromium/server launch outside
          # the measured trials. Use identical tests and profiling, but no JSON
          # output: this run never participates in the A/B comparison.
          echo "::group::Unmeasured baseline warm-up"
          PRKS_E2E_BENCHMARK_RESULT="" \
            PRKS_E2E_ROUTE_FASTPATH=0 python tests/e2e/run.py \
            --feature shell --feature work-create \
            --jobs 1 --no-pointer-capture --profile
          echo "::endgroup::"

          # Identical selection, runner, worker count and instrumentation.
          # ABBA limits linear drift after the one-time warm-up is excluded.
          for trial in 1 2 3 4; do
            case "$trial" in
              1|4) mode=baseline; flag=0 ;;
              2|3) mode=fastpath; flag=1 ;;
            esac
            echo "::group::Trial $trial ($mode)"
            result_file="$RUNNER_TEMP/e2e-routing-ab-$trial.json"
            rm -f "$result_file"
            PRKS_E2E_BENCHMARK_RESULT="$result_file" \
              PRKS_E2E_ROUTE_FASTPATH="$flag" python tests/e2e/run.py \
              --feature shell --feature work-create \
              --jobs 1 --no-pointer-capture --profile
            echo "::endgroup::"
          done

          python - <<'PY'
          import json
          import math
          import os
          import statistics
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          rows = []
          phase_rows = []
          browser_nav_rows = []
          # Browser-native times are diagnostic subsets of page navigation,
          # NOT another additive partition of Playwright's app_ready.
          browser_nav_phases = (
              ("Response wait / first byte", "nav_response_wait"),
              ("Response body transfer", "nav_response_body"),
              ("DOM parsing to DOMContentLoaded", "nav_dom_content_loaded"),
          )
          # These phases were added by #699. Children partition an inclusive
          # parent; never sum parent and child columns as separate overhead.
          startup_phases = (
              ("Server startup (inclusive)", "server_start"),
              ("↳ Python process spawn", "server_spawn"),
              ("↳ HTTP /api/works readiness", "server_http_ready"),
              ("App readiness (inclusive)", "app_ready"),
              ("↳ Page navigation", "app_navigation"),
              ("↳ Sidebar wait", "app_sidebar_wait"),
              ("↳ Folder view wait", "app_folder_wait"),
              ("↳ Canonical route wait", "app_route_wait"),
          )
          required = {
              "schema_version", "benchmark_modes", "workers", "tests",
              "failures", "errors", "skipped", "wall_seconds", "phase_seconds",
          }
          for trial, mode in enumerate(("baseline", "fastpath", "fastpath", "baseline"), 1):
              path = root / f"e2e-routing-ab-{trial}.json"
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, ValueError) as exc:
                  raise SystemExit(f"Trial {trial}: missing/invalid benchmark JSON: {exc}") from exc
              if not isinstance(data, dict) or set(data) != required:
                  raise SystemExit(f"Trial {trial}: unsupported benchmark result schema")
              expected = ["profile"] if mode == "baseline" else ["profile", "route-fastpath"]
              if data["schema_version"] != 1 or data["benchmark_modes"] != expected:
                  raise SystemExit(f"Trial {trial}: benchmark mode/schema mismatch")
              if type(data["workers"]) is not int or data["workers"] != 1:
                  raise SystemExit(f"Trial {trial}: wrong worker count")
              if any(
                  type(data[key]) is not int
                  for key in ("tests", "failures", "errors", "skipped")
              ):
                  raise SystemExit(f"Trial {trial}: invalid test counts")
              if data["tests"] < 1 or any(data[k] for k in ("failures", "errors", "skipped")):
                  raise SystemExit(f"Trial {trial}: incomplete/failed selection")
              seconds = data["wall_seconds"]
              phases = data["phase_seconds"]
              if (
                  type(seconds) not in (int, float)
                  or not math.isfinite(seconds)
                  or seconds <= 0
                  or not isinstance(phases, dict)
              ):
                  raise SystemExit(f"Trial {trial}: invalid performance metrics")
              routing = phases.get("routing_decision")
              if (
                  type(routing) not in (int, float)
                  or not math.isfinite(routing)
                  or routing <= 0
              ):
                  raise SystemExit(f"Trial {trial}: missing/invalid routing metric")
              startup = {}
              for _, key in startup_phases:
                  value = phases.get(key)
                  if (
                      type(value) not in (int, float)
                      or not math.isfinite(value)
                      or value < 0
                  ):
                      raise SystemExit(f"Trial {trial}: missing/invalid {key} metric")
                  startup[key] = value
              for parent, children in (
                  ("server_start", ("server_spawn", "server_http_ready")),
                  (
                      "app_ready",
                      ("app_navigation", "app_sidebar_wait",
                       "app_folder_wait", "app_route_wait"),
                  ),
              ):
                  if not math.isclose(
                      startup[parent],
                      sum(startup[key] for key in children),
                      rel_tol=0,
                      abs_tol=0.01,
                  ):
                      raise SystemExit(
                          f"Trial {trial}: {parent} does not match its subphase totals"
                      )
              browser_nav = {}
              for _, key in browser_nav_phases:
                  value = phases.get(key)
                  if value is None:
                      continue  # PerformanceNavigationTiming may be unavailable.
                  if (
                      type(value) not in (int, float)
                      or not math.isfinite(value)
                      or value < 0
                  ):
                      raise SystemExit(f"Trial {trial}: invalid {key} metric")
                  browser_nav[key] = value
              rows.append((trial, mode, data["tests"], seconds, routing))
              phase_rows.append((mode, startup))
              browser_nav_rows.append((mode, browser_nav))

          if len(set(row[2] for row in rows)) != 1:
              raise SystemExit("A/B trials discovered different test counts")
          baseline = statistics.median(row[3] for row in rows if row[1] == "baseline")
          fastpath = statistics.median(row[3] for row in rows if row[1] == "fastpath")
          relative = 100.0 * (fastpath - baseline) / baseline
          summary = [
              "## E2E route fast-path A/B (manual, diagnostic)",
              "",
              f"Commit: {os.environ['GITHUB_SHA'][:12]} · {rows[0][2]} selected tests per trial · same runner",
              "",
              "| Trial | Mode | E2E wall time | Routing decision sum |",
              "|---|---|---:|---:|",
          ]
          for trial, mode, _, seconds, routing in rows:
              summary.append(f"| {trial} | {mode} | {seconds:.2f}s | {routing:.2f}s |")
          summary += [
              "",
              f"Baseline median: **{baseline:.2f}s**; fast-path median: **{fastpath:.2f}s**.",
              f"Fast-path change: **{relative:+.2f}%** (negative = faster).",
              "",
              "### Server startup and app readiness (summed across selected tests)",
              "",
              "| Profile phase | Baseline median | Fast-path median |",
              "|---|---:|---:|",
          ]
          for label, key in startup_phases:
              baseline_phase = statistics.median(
                  phases[key] for mode, phases in phase_rows if mode == "baseline"
              )
              fastpath_phase = statistics.median(
                  phases[key] for mode, phases in phase_rows if mode == "fastpath"
              )
              summary.append(f"| {label} | {baseline_phase:.2f}s | {fastpath_phase:.2f}s |")
          summary += [
              "",
              "Nested rows partition their inclusive parent; do not add them twice.",
              "Profile phase sums may overlap unrelated test work and are not equivalent",
              "to removable wall time.",
              "",
              "### Browser Navigation Timing (opt-in, diagnostic)",
              "",
          ]
          coverage = sum(
              all(key in phases for _, key in browser_nav_phases)
              for _, phases in browser_nav_rows
          )
          if coverage == len(browser_nav_rows):
              summary += [
                  "| Browser milestone | Baseline median | Fast-path median |",
                  "|---|---:|---:|",
              ]
              for label, key in browser_nav_phases:
                  baseline_phase = statistics.median(
                      phases[key] for mode, phases in browser_nav_rows if mode == "baseline"
                  )
                  fastpath_phase = statistics.median(
                      phases[key] for mode, phases in browser_nav_rows if mode == "fastpath"
                  )
                  summary.append(
                      f"| {label} | {baseline_phase:.2f}s | {fastpath_phase:.2f}s |"
                  )
              summary.append(
                  "Browser measurements use the Navigation Timing API (milliseconds "
                  "converted to seconds), not additional Python app-ready time."
              )
          else:
              summary.append(
                  f"Navigation Timing unavailable/incomplete for "
                  f"{len(browser_nav_rows) - coverage} of {len(browser_nav_rows)} "
                  "trials; existing routing and startup results are still valid."
              )
          summary += [
              "",
              "Single small-sample diagnostic only: runner variance and profiling overhead remain.",
              "Do not enable the fast path by default without repeated and full-suite evidence.",
          ]
          report = "\n".join(summary) + "\n"
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(report)
          PY
