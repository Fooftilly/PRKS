name: E2E Classic Production Distribution Gate

# Non-required, exact packaged candidate validation for #736. This separate
# workflow does not change normal PRKS E2E selection or required check names.
on:
  pull_request:
    paths:
      # Bundles and offline manifest derive from every shipped frontend asset.
      # A frontend-only PR must not bypass packaged regression coverage.
      - "frontend/**"
      - Dockerfile
      - scripts/build_classic_distribution.py
      - scripts/e2e_classic_sw_transitions.py
      - tests/e2e/test_classic_sw_transitions.py
      - tests/e2e/run.py
      - tests/e2e/policy.py
      - tests/test_e2e_classic_sw_transitions.py
      - scripts/benchmark_classic_script_bundle.py
      - tests/test_classic_distribution.py
      - .github/workflows/e2e-classic-distribution-gate.yml
  workflow_dispatch:
    inputs:
      packaged_mode:
        description: "Packaged E2E validation (full default; smoke pilot or paired compare require manual dispatch)"
        type: choice
        options:
          - full
          - smoke
          - compare
        default: full

permissions:
  contents: read

concurrency:
  group: e2e-classic-distribution-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, inputs.packaged_mode) }}
  cancel-in-progress: true

jobs:
  docker-build-modes:
    name: Docker classic bundle and rollback build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Build the actual default Docker target in both modes. Inspecting only
      # frontend-builder would not verify runtime COPY or runtime dependencies.
      - name: Verify bundled runtime image and copied assets
        shell: bash
        run: |
          set -euo pipefail
          docker build --build-arg PRKS_CLASSIC_BUNDLES=1 -t prks-classic:runtime-bundled .
          docker run --rm --entrypoint sh prks-classic:runtime-bundled -ec '
            test -s /app/frontend/js/prks-classic-head.bundle.js
            test -s /app/frontend/js/prks-classic-body.bundle.js
            test -s /app/frontend/js/app.js
            test -s /app/frontend/sw.js
            test -s /app/dependency-inventory.json
            grep -q prks-classic-head.bundle.js /app/frontend/index.html
            grep -q prks-classic-body.bundle.js /app/frontend/index.html
            grep -q CLASSIC_BUNDLE_REVISION /app/frontend/sw.js
            command -v python >/dev/null 2>&1
            ! command -v node >/dev/null 2>&1
          '

      - name: Verify unbundled runtime rollback image
        shell: bash
        run: |
          set -euo pipefail
          docker build --build-arg PRKS_CLASSIC_BUNDLES=0 -t prks-classic:runtime-rollback .
          docker run --rm --entrypoint sh prks-classic:runtime-rollback -ec '
            test -s /app/frontend/js/app.js
            test -s /app/frontend/sw.js
            test -s /app/dependency-inventory.json
            grep -q /js/app.js /app/frontend/index.html
            ! test -e /app/frontend/js/prks-classic-head.bundle.js
            ! test -e /app/frontend/js/prks-classic-body.bundle.js
            ! grep -q CLASSIC_BUNDLE_REVISION /app/frontend/sw.js
            command -v python >/dev/null 2>&1
            ! command -v node >/dev/null 2>&1
          '

  worker-upgrade-rollback:
    name: Classic bundle SW upgrade and rollback (real Chromium)
    runs-on: ubuntu-latest
    # Every E2E server runs PRKS_AUTH=loopback-owner on its own disposable
    # database of this PostgreSQL 18 server (tests/e2e/postgres_identity.py).
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PRKS_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .playwright-browsers
          key: >-
            playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt',
            'tests/e2e/install_browser.py') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install runtime and E2E dependencies
        # The E2E server needs the PostgreSQL runtime pins (tests/e2e/postgres_identity.py).
        run: python scripts/ci/install_pinned_python.py e2e

      - name: Ensure Chromium in repo cache
        run: python tests/e2e/install_browser.py

      - name: Validate SW cache versions and transition guard tests
        run: python -m unittest tests.test_e2e_classic_sw_transitions

      - name: Exercise online upgrade, offline boot, and downgrade
        env:
          PRKS_E2E_CLASSIC_SW_TRANSITIONS: "1"
        run: >-
          python tests/e2e/run.py --jobs 1 --no-pointer-capture
          tests.e2e.test_classic_sw_transitions.ClassicSWTransitionTests.test_unbundled_bundled_unbundled

  packaged-frontend:
    name: Packaged classic bundles (${{ matrix.shard }}/6)
    # Pull requests always keep the six-shard packaged regression matrix.
    # Explicit manual smoke omits full shards; manual compare runs BOTH modes
    # against one SHA. PR/release coverage remains the full six-shard matrix.
    if: github.event_name != 'workflow_dispatch' || inputs.packaged_mode != 'smoke'
    runs-on: ubuntu-latest
    # Every E2E server runs PRKS_AUTH=loopback-owner on its own disposable
    # database of this PostgreSQL 18 server (tests/e2e/postgres_identity.py).
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PRKS_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .playwright-browsers
          key: >-
            playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt',
            'tests/e2e/install_browser.py') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install runtime and E2E dependencies
        run: python scripts/ci/install_pinned_python.py e2e

      - name: Ensure Chromium in repo cache
        run: python tests/e2e/install_browser.py

      - name: Stage the exact deterministic production distribution
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_classic_distribution
          mkdir -p .tests
          python -m scripts.build_classic_distribution --root . --output .tests/classic-distribution
          mv frontend .tests/classic-original
          mv .tests/classic-distribution frontend
          node --check frontend/js/prks-classic-head.bundle.js
          node --check frontend/js/prks-classic-body.bundle.js
          node --check frontend/sw.js
          python -m unittest tests.test_frontend_service_worker

      - name: Run complete E2E shard on the packaged frontend
        env:
          PRKS_E2E_SHARD_INDEX: ${{ matrix.shard }}
          PRKS_E2E_ROUTE_FASTPATH: "0"
        shell: bash
        run: |
          set -euo pipefail
          python tests/e2e/run.py --jobs 1 --shard "${PRKS_E2E_SHARD_INDEX}/6" --no-pointer-capture

      # Exact test ID → elapsed seconds for a complete manual bundled run.
      # Keep this manual-only; ordinary PRs continue without extra artifacts.
      # Never export browser traces, local stores, or the whole .tests tree.
      - name: Export packaged test timings (manual full benchmark only)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (inputs.packaged_mode == 'full' || inputs.packaged_mode == 'compare') && success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaged-e2e-timings-${{ matrix.shard }}-of-6
          path: .tests/e2e-timings.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload shard failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: classic-distribution-shard-${{ matrix.shard }}-failure
          path: |
            .tests/e2e-failure-diagnostics.json
            .tests/e2e-last-failed.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  packaged-smoke:
    name: Packaged classic smoke (manual pilot)
    # Compare runs the full six shards and smoke in this SAME workflow run;
    # only an explicit workflow_dispatch can activate the smoke job.
    # A cost/coverage measurement, NOT a substitute for the PR or release gate.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.packaged_mode == 'smoke' || inputs.packaged_mode == 'compare')
    runs-on: ubuntu-latest
    # Every E2E server runs PRKS_AUTH=loopback-owner on its own disposable
    # database of this PostgreSQL 18 server (tests/e2e/postgres_identity.py).
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PRKS_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .playwright-browsers
          key: >-
            playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt',
            'tests/e2e/install_browser.py') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install runtime and E2E dependencies
        run: python scripts/ci/install_pinned_python.py e2e

      - name: Ensure Chromium in repo cache
        run: python tests/e2e/install_browser.py

      - name: Stage the same deterministic production distribution as the full shards
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_classic_distribution
          mkdir -p .tests
          python -m scripts.build_classic_distribution --root . --output .tests/classic-distribution
          mv frontend .tests/classic-original
          mv .tests/classic-distribution frontend
          node --check frontend/js/prks-classic-head.bundle.js
          node --check frontend/js/prks-classic-body.bundle.js
          node --check frontend/sw.js
          python -m unittest tests.test_frontend_service_worker

      - name: Exercise packaged shell, offline and PDF/Work boundaries
        shell: bash
        run: |
          set -euo pipefail
          # Curated smoke IDs must all exist; the runner fails closed otherwise.
          python tests/e2e/run.py --jobs 1 --smoke --no-pointer-capture
          # Include high-risk packaged PDF/offline and Graph/record navigation
          # boundaries in addition to the nine curated smoke cases. This
          # is still a manual experiment, NOT a full-suite substitute.
          python tests/e2e/run.py --jobs 1 --no-pointer-capture \
            tests.e2e.test_app.MainSecondaryDividerTests.test_divider_drag_causes_no_additional_route_or_pdf_requests \
            tests.e2e.test_app.PdfPersistenceTests.test_annotation_copy_link_reports_clipboard_success_and_failure \
            tests.e2e.test_offline.OfflineFoundationTests.test_previously_opened_pdf_reopens_offline \
            tests.e2e.test_offline.OfflineFoundationTests.test_cached_pdf_reopened_offline_keeps_annotation_tools \
            tests.e2e.test_research_graph_offline.ResearchGraphOfflineTests.test_record_graph_navigation_both_directions

      - name: Record scope and code provenance
        env:
          PRKS_E2E_BASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          {
            printf 'Manual packaged-smoke pilot only; full PR six-shard package coverage is unchanged.\n'
            printf 'If packaged_mode=compare, six full packaged shards also run on this exact workflow SHA; shared Docker and SW jobs execute once.\n'
            printf 'Commit: %s; packaged smoke: 9 curated + 5 explicit browser tests; SW upgrade/rollback and Docker checks are separate jobs.\n' "$PRKS_E2E_BASE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload smoke failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: classic-distribution-smoke-failure
          path: |
            .tests/e2e-failure-diagnostics.json
            .tests/e2e-last-failed.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
