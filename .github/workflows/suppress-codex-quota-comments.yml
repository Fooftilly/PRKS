name: Suppress noisy review bot comments

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

jobs:
  remove-noise-comment:
    if: >-
      (
        (
          contains(github.event.comment.body, 'You have reached your Codex usage limits') &&
          contains(github.event.comment.body, 'code reviews') &&
          (
            github.event.comment.user.login == 'chatgpt-codex-connector[bot]' ||
            github.event.comment.performed_via_github_app.slug == 'chatgpt-codex-connector'
          )
        ) ||
        (
          github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, 'Great, no issues found!') &&
          contains(
            github.event.comment.body,
            'Qodo reviewed your code and found no material issues that require review'
          ) &&
          (
            github.event.comment.user.login == 'qodo-code-review[bot]' ||
            github.event.comment.performed_via_github_app.slug == 'qodo-code-review'
          )
        )
      ) &&
      (
        github.event_name == 'pull_request_review_comment' ||
        github.event.issue.pull_request
      )

    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Delete matched bot-noise comment
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "issue_comment" ]]; then
            gh api --method DELETE               "repos/${REPOSITORY}/issues/comments/${COMMENT_ID}"
          else
            gh api --method DELETE               "repos/${REPOSITORY}/pulls/comments/${COMMENT_ID}"
          fi
