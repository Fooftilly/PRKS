name: Suppress Codex quota comments

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

jobs:
  remove-quota-comment:
    if: >-
      contains(github.event.comment.body, 'You have reached your Codex usage limits') &&
      contains(github.event.comment.body, 'code reviews') &&
      (
        github.event.comment.user.login == 'chatgpt-codex-connector[bot]' ||
        github.event.comment.performed_via_github_app.slug == 'chatgpt-codex-connector'
      ) &&
      (
        github.event_name == 'pull_request_review_comment' ||
        github.event.issue.pull_request
      )

    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Delete Codex quota comment
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "issue_comment" ]]; then
            gh api --method DELETE               "repos/${REPOSITORY}/issues/comments/${COMMENT_ID}"
          else
            gh api --method DELETE               "repos/${REPOSITORY}/pulls/comments/${COMMENT_ID}"
          fi
