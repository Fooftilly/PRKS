name: Python coverage pilot

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/python-coverage-pilot.yml"
      - "backend/domain/text_identity.py"
      - "backend/research_markup.py"
      - "tests/test_text_identity.py"
      - "tests/fixtures/text_identity_vectors.json"
      - "scripts/changed_line_coverage.py"
      - "tests/test_changed_line_coverage.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  text-identity-coverage:
    name: Python line + branch coverage (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # PR merge first parent is the baseline for changed executable lines.
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install pinned coverage.py
        run: >-
          python -m pip install --isolated --disable-pip-version-check
          "--only-binary=:all:" "coverage==7.16.2"

      # B1 / #651: bounded pilot on existing, pure-Python test vectors.
      # This is NOT whole-backend coverage and has no fail-under threshold.
      # Keep the existing full PRKS Test Gate unchanged (#180 guard).
      - name: Measure text identity line and branch coverage
        shell: bash
        run: |
          set -euo pipefail
          python -m coverage run --branch --source=backend.domain.text_identity \
            -m unittest discover -s tests -p test_text_identity.py
          python -m coverage report --show-missing
          python -m coverage json -o "$RUNNER_TEMP/prks-coverage.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          totals = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "prks-coverage.json").read_text(
                  encoding="utf-8"
              )
          )["totals"]
          lines = totals["num_statements"]
          branches = totals["num_branches"]
          line_rate = (
              f'{100 * totals["covered_lines"] / lines:.1f}%' if lines else "N/A"
          )
          branch_rate = (
              f'{100 * totals["covered_branches"] / branches:.1f}%'
              if branches
              else "N/A"
          )
          summary = (
              "## Python coverage pilot (text identity only)\n\n"
              f'- Lines: {totals["covered_lines"]}/{lines} ({line_rate})\n'
              f'- Branches: {totals["covered_branches"]}/{branches} ({branch_rate})\n\n'
              "Informational only; no threshold. This is a focused module, "
              "not overall Python/backend coverage. Raw coverage data stays "
              "on the runner and is not uploaded.\n"
          )
          print(summary)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as out:
              out.write(summary)
          PY

      - name: Report newly changed executable lines (informational)
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_changed_line_coverage
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "No changed-line comparison on manual coverage runs." >> "$GITHUB_STEP_SUMMARY"
          elif git rev-parse --verify 'HEAD^1^{commit}' >/dev/null 2>&1; then
            patch="$RUNNER_TEMP/prks-python-changed.diff"
            git diff --no-ext-diff --unified=0 HEAD^1 HEAD -- \
              backend/domain/text_identity.py > "$patch"
            python scripts/changed_line_coverage.py \
              --format coveragepy \
              --report "$RUNNER_TEMP/prks-coverage.json" \
              --diff "$patch" \
              --source backend/domain/text_identity.py \
              --summary-file "$GITHUB_STEP_SUMMARY"
          else
            echo "Changed-line comparison unavailable (missing PR merge parent); no ratio inferred." >> "$GITHUB_STEP_SUMMARY"
          fi
