# One-shot, branch-scoped maintenance task. Deletes itself after a verified rebuild.
name: One-shot frontend vendor artifact repair 1098
on:
  push:
    branches:
      - dependabot/npm_and_yarn/tools/frontend-vendor/frontend-vendor-routine-57aafb71d5
    paths:
      - .github/workflows/dependency-artifact-repair-1098.yml
permissions:
  contents: write
jobs:
  rebuild:
    if: github.repository == 'Fooftilly/PRKS'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Validate one-shot branch and reviewed parent
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "dependabot/npm_and_yarn/tools/frontend-vendor/frontend-vendor-routine-57aafb71d5"
          test "$(git rev-parse HEAD^)" = "232003b8f35b36d54f9f6bde692b04ca0ace313d"
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("tools/frontend-vendor/package.json").read_text())
          assert data["dependencies"]["lucide"] == "1.61.0"
          PY
      - name: Set up pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Rebuild and validate pinned frontend vendor assets
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/refresh_dependency_artifacts.sh frontend-vendor
          if git diff --quiet -- frontend/; then echo "No generated frontend changes"; exit 1; fi
      - name: Commit generated assets and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PRKS dependency maintainer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- frontend/
          git rm -- .github/workflows/dependency-artifact-repair-1098.yml
          git commit -m "build(deps): regenerate Lucide 1.61.0 vendor artifacts"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
