name: E2E PDF Annotation Rollback Profile

# Manual-only diagnostic under #740. Normal PR/master E2E costs are unchanged.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-pdf-rollback-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  profile:
    name: Profile independent PDF annotation rollbacks
    runs-on: ubuntu-latest
    # Every E2E server runs PRKS_AUTH=loopback-owner on its own disposable
    # database of this PostgreSQL 18 server (tests/e2e/postgres_identity.py).
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PRKS_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .playwright-browsers
          key: >-
            playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt',
            'tests/e2e/install_browser.py') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install pinned runtime and E2E dependencies
        run: python scripts/ci/install_pinned_python.py e2e

      - name: Ensure Chromium in repo cache
        run: python tests/e2e/install_browser.py

      - name: Profile fresh-storage PDF rollback trials
        shell: bash
        env:
          PRKS_E2E_PROFILE: "1"
          TARGET: tests.e2e.test_app.PdfAnnotationCommentEditTests.test_an_uncommitted_edit_does_not_hold_another_annotations_rollback
        run: |
          set -euo pipefail
          # Exclude one identical warm-up. Every invocation owns a fresh
          # temporary server, browser context and IndexedDB; no retries.
          PRKS_E2E_BENCHMARK_RESULT="" \
            python tests/e2e/run.py --jobs 1 --no-pointer-capture --profile "$TARGET"

          for trial in 1 2 3; do
            echo "::group::PDF rollback phase trial $trial"
            result_file="$RUNNER_TEMP/pdf-rollback-profile-$trial.json"
            rm -f "$result_file"
            PRKS_E2E_BENCHMARK_RESULT="$result_file" \
              python tests/e2e/run.py --jobs 1 --no-pointer-capture --profile "$TARGET"
            echo "::endgroup::"
          done

          python - <<'PY'
          import json
          import math
          import os
          from pathlib import Path
          from statistics import median

          root = Path(os.environ["RUNNER_TEMP"])
          records = [json.loads((root / f"pdf-rollback-profile-{i}.json").read_text())
                     for i in (1, 2, 3)]
          stages = (
              "pdf_rollback_setup",
              "pdf_rollback_create_first",
              "pdf_rollback_create_second",
              "pdf_rollback_seed_committed",
              "pdf_rollback_induce_uncommitted",
              "pdf_rollback_fail_other_save",
              "pdf_rollback_verify_independent",
              "pdf_rollback_verify_late",
          )
          for i, result in enumerate(records, 1):
              if any(result.get(key) != expected for key, expected in (
                      ("tests", 1), ("failures", 0), ("errors", 0), ("skipped", 0))):
                  raise SystemExit(f"Trial {i} did not finish one passing browser test")
              durations = result.get("phase_seconds") or {}
              missing = set(stages) - durations.keys()
              failures = sorted(key for key in durations
                                if key.startswith("pdf_rollback_") and key.endswith("_failed"))
              bad = [key for key in stages
                     if key in durations and (not math.isfinite(float(durations[key]))
                                               or float(durations[key]) < 0)]
              if missing or failures or bad:
                  raise SystemExit(f"Trial {i}: missing={sorted(missing)}, "
                                   f"failed={failures}, invalid={bad}")

          summary = [
              "## PDF annotation independent rollback phase profile",
              "",
              "One excluded warm-up and three passing isolated Chromium trials.",
              "All original viewer, local-durability and server assertions remain in the test.",
              "These eight ordered stages include browser waits and network setup; "
              "do not add them to overlapping generic infrastructure or async-wait timers.",
              "",
              "| Phase | Median (s) | Trials (s) |",
              "| --- | ---: | --- |",
          ]
          for key in stages:
              values = [float(result["phase_seconds"][key]) for result in records]
              summary.append(f"| `{key}` | {median(values):.3f} | "
                             + ", ".join(f"{value:.3f}" for value in values) + " |")
          walls = [float(result["wall_seconds"]) for result in records]
          summary.extend((
              "",
              f"Single-test wall median: **{median(walls):.3f}s**.",
              "No assertion, gate selection, timeout, retry or test-isolation policy changed.",
              "Diagnose repeatable slow stages before considering a production or harness fix.",
          ))
          report = "\n".join(summary) + "\n"
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(report)
          PY

      - name: Upload failure diagnostics only
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf-annotation-rollback-profile-failure
          path: |
            .tests/e2e-failure-diagnostics.json
            .tests/e2e-last-failed.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
