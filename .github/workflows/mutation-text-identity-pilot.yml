name: Advisory Python mutation testing (text identity)

# B2 / #651: opt-in, bounded experiment, not a required status or a
# repository-wide mutation job. Changing production Python alone does NOT
# trigger it; maintainers can dispatch it when this test is useful.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/mutation-text-identity-pilot.yml"
      - "setup.cfg"

permissions:
  contents: read

concurrency:
  group: text-identity-mutation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  text-identity-mutation:
    name: Text-identity mutation adequacy (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout committed synthetic test sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned opt-in mutmut (Python test tooling only)
        run: >-
          python -m pip install --isolated --disable-pip-version-check
          --no-input "mutmut==3.8.0"

      - name: Confirm existing exact text-identity vector tests pass
        run: python -m pytest -q tests/test_text_identity.py

      - name: Execute bounded isolated mutants
        shell: bash
        run: |
          set -euo pipefail
          # Stop on tool failures/timeouts; never call an incomplete
          # mutation experiment a completed score.
          timeout --signal=TERM --kill-after=10s 360s mutmut run
          mutmut export-cicd-stats

      - name: Record private-data-free advisory result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          file = Path("mutants/mutmut-cicd-stats.json")
          if not file.is_file():
              raise SystemExit("Mutation experiment incomplete: no stats produced")
          stats = json.loads(file.read_text(encoding="utf-8"))
          if not isinstance(stats, dict):
              raise SystemExit("Mutation experiment incomplete: invalid stats")
          # These keys are mutmut 3.8.0's export-cicd-stats JSON
          # schema, not human-readable names from its CLI progress.
          keys = (
              "total", "killed", "survived", "timeout", "skipped",
              "suspicious", "no_tests", "segfault",
              "check_was_interrupted_by_user",
          )
          if set(stats) != set(keys):
              raise SystemExit("Mutation experiment incomplete: unexpected stats schema")
          clean = {}
          for key in keys:
              value = stats[key]
              if type(value) is not int or value < 0:
                  raise SystemExit("Mutation experiment incomplete: invalid count")
              clean[key] = value
          if clean["total"] < 1 or clean["killed"] < 1:
              raise SystemExit("Mutation experiment produced no killed outcomes")
          if sum(value for key, value in clean.items() if key != "total") != clean["total"]:
              raise SystemExit("Mutation experiment incomplete: unaccounted mutants")
          if clean["check_was_interrupted_by_user"] or clean["segfault"]:
              raise SystemExit("Mutation experiment incomplete: interrupted or crashed mutants")
          lines = [
              "## PRKS text-identity mutation pilot (advisory)",
              "",
              "Scope: `backend/domain/text_identity.py` only, with existing "
              "synthetic Unicode text vectors. Mutmut 3.8.0 / Python 3.12.",
              "Counts describe mutant test-process outcomes, not proven bugs.",
              "Killed means a nonzero mutant-test exit (assertion OR runner error).",
              "Review individual mutants before treating a killed outcome as a test-quality signal.",
              "",
              "| Outcome | Count |",
              "| --- | ---: |",
          ]
          lines += [f"| {key} | {value} |" for key, value in clean.items()]
          lines += [
              "",
              "Surviving mutations require individual review. No automatic "
              "failure threshold, no production data or remote report artifact.",
          ]
          summary = "\n".join(lines) + "\n"
          print(summary)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open(
              "a", encoding="utf-8"
          ) as output:
              output.write(summary)
          PY
