name: Workflow lint (actionlint + ShellCheck)

on:
  # Always report the check for PRs, even when no workflows changed.
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    # Always-reported PR check, suitable for a future required ruleset check.
    # This PR does not itself change branch protection.
    name: Workflow syntax and ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Two commits include the base parent of GitHub's PR merge commit.
          fetch-depth: 2
          persist-credentials: false

      - name: Determine whether to run workflow lint
        id: scope
        shell: bash
        env:
          PRKS_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          run_lint="$(python3 scripts/ci_workflow_lint_scope.py)"
          printf 'run_lint=%s\n' "$run_lint" >> "$GITHUB_OUTPUT"
          if [[ "$run_lint" == "true" ]]; then
            echo "Workflow lint selected."
          else
            echo "No workflow changes: successful check without tool downloads."
          fi

      - name: Install pinned actionlint
        if: steps.scope.outputs.run_lint == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="1.7.12"
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --proto '=https' --proto-redir '=https' --fail --location --silent --show-error --retry 3 --max-time 60 \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint

      - name: Install checksum-verified ShellCheck
        if: steps.scope.outputs.run_lint == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="0.11.0"
          archive="${RUNNER_TEMP}/shellcheck.tar.xz"
          curl --proto '=https' --proto-redir '=https' --fail --location --silent --show-error --retry 3 --max-time 60 \
            --output "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${version}/shellcheck-v${version}.linux.x86_64.tar.xz"
          printf '%s  %s\n' \
            '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198' \
            "$archive" | sha256sum --check
          tar -xJf "$archive" -C "$RUNNER_TEMP" "shellcheck-v${version}/shellcheck"
          "$RUNNER_TEMP/shellcheck-v${version}/shellcheck" --version

      # Regression fixture proves actionlint really invokes the pinned
      # ShellCheck integration rather than silently skipping embedded shell.
      - name: Verify actionlint ShellCheck integration
        if: steps.scope.outputs.run_lint == 'true'
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/actionlint-shellcheck-fixture.yml"
          cat > "$fixture" <<'YAML'
          name: ShellCheck integration fixture
          on: push
          jobs:
            fixture:
              runs-on: ubuntu-latest
              steps:
                - shell: bash
                  run: echo $UNQUOTED_PATH
          YAML
          if "$RUNNER_TEMP/actionlint" -oneline \
            -shellcheck="$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" -pyflakes= \
            "$fixture" > "$RUNNER_TEMP/actionlint-fixture.log" 2>&1; then
            echo "::error::actionlint failed to report the known ShellCheck fixture finding"
            exit 1
          fi
          if ! grep -q 'SC2086' "$RUNNER_TEMP/actionlint-fixture.log"; then
            cat "$RUNNER_TEMP/actionlint-fixture.log"
            echo "::error::expected ShellCheck SC2086 was not reported by actionlint"
            exit 1
          fi

      # The advisory pilot (#653/#674) found one E2E matrix-interpolation
      # warning (SC2309); the shard runner now uses environment variables.
      # Treat new lint findings as job failures, without claiming this check
      # is required by branch protection. Keep the narrow concurrency.queue
      # compatibility ignore until supported by upstream actionlint.
      # pyflakes remains disabled pending separate signal assessment.
      # https://github.com/rhysd/actionlint/pull/654
      - name: Check all workflows (fail on findings)
        if: steps.scope.outputs.run_lint == 'true'
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/actionlint" -oneline \
            -shellcheck="$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" -pyflakes= \
            -ignore 'unexpected key "queue" for "concurrency" section'
