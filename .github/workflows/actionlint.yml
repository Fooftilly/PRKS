name: actionlint pilot

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Check workflow syntax (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          version="1.7.12"
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --location --silent --show-error --retry 3 --max-time 60 \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint

      # First rollout is advisory for lint findings, but tool failures remain
      # fatal. ShellCheck/pyflakes are separate future slices.
      # GitHub supports concurrency.queue, but actionlint v1.7.12 does not yet
      # recognize it. Remove this narrow ignore once upstream support ships:
      # https://github.com/rhysd/actionlint/pull/654
      - name: Check all workflows (advisory)
        id: lint
        shell: bash
        run: |
          set -euo pipefail
          if "$RUNNER_TEMP/actionlint" -oneline -shellcheck= -pyflakes= \
            -ignore 'unexpected key "queue" for "concurrency" section'; then
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
          else
            code=$?
            if [ "$code" -eq 1 ]; then
              echo "has_findings=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::actionlint execution failed (exit code $code)"
              exit "$code"
            fi
          fi

      - name: Surface actionlint findings
        if: steps.lint.outputs.has_findings == 'true'
        shell: bash
        run: |
          echo "::warning::actionlint reported workflow findings; review the advisory step before making it blocking (see #651)."
