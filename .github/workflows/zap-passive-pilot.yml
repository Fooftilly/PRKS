name: Advisory passive ZAP security pilot

# A manual, passive-only OWASP ZAP pass over a fixed allowlist of requests to a
# disposable loopback --testing server with synthetic data (#860). ZAP runs in
# safe mode: no spider, no active scan. Not a PR gate; findings are triaged
# into issues before anything blocks.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zap-passive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  passive:
    name: Passive ZAP pilot (advisory)
    runs-on: ubuntu-24.04
    # The pilot server signs its owner and one editor in by password on its
    # own disposable database of this PostgreSQL 18 server.
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PRKS_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
    timeout-minutes: 20
    steps:
      - name: Checkout PRKS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned runtime prerequisites
        run: python scripts/ci/install_pinned_python.py runtime

      - name: Pull the pinned ZAP image
        run: docker pull "$(python -c 'from scripts.ci.zap_passive_pilot import ZAP_IMAGE; print(ZAP_IMAGE)')"

      - name: Run the passive pilot
        env:
          PRKS_TESTING: "1"
        run: python scripts/ci/zap_passive_pilot.py --out zap-summary.json

      - name: Summarize the passive pilot
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo "## Passive ZAP pilot (advisory)"
            echo "- Disposable loopback --testing server, synthetic library, anonymous + owner + editor"
            echo "- ZAP in safe mode: passive rules on the pilot's own allowlisted requests only"
            echo "- Summary below: rule ids, names, risk, counts and route templates; no URLs with values, evidence or cookies"
            echo
            echo '```json'
            if [ -f zap-summary.json ]; then cat zap-summary.json; else echo '{"problems": ["no summary"]}'; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the bounded summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-passive-summary
          path: zap-summary.json
          if-no-files-found: ignore
          retention-days: 30
