name: E2E Offline Person Recently Added Click Trace

# Separate, parameter-free manual-only Playwright actionability diagnostic (#740).
# The existing paired Person profile workflow is unchanged; no automatic PR gate.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: e2e-person-recent-click-trace-${{ github.ref }}
  cancel-in-progress: false

jobs:
  profile:
    name: Trace Person Create real Recently Added click
    runs-on: ubuntu-latest
    # Every E2E server runs PRKS_AUTH=loopback-owner on its own disposable
    # database of this PostgreSQL 18 server (tests/e2e/postgres_identity.py).
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PRKS_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .playwright-browsers
          key: >-
            playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt',
            'tests/e2e/install_browser.py') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install pinned runtime and E2E dependencies
        run: python scripts/ci/install_pinned_python.py e2e

      - name: Ensure Chromium in repo cache
        run: python tests/e2e/install_browser.py

      - name: Trace one existing Person Create Chromium scenario
        shell: bash
        env:
          PRKS_E2E_PROFILE: "1"
          PRKS_E2E_PERSON_RECENT_TRIAL: "0"
          DEBUG: "pw:api"
        run: |
          set -euo pipefail
          # One actual user-flow click, with normal durable/server assertions.
          # No trial click, retries, extra browser runs or trace ZIP uploads.
          # Only synthetic E2E fixtures are used. Diagnostic log stays in CI.
          python tests/e2e/run.py --jobs 1 --no-pointer-capture --profile \
            tests.e2e.test_person_create_offline.OfflinePersonCreateTests.test_a_person_created_offline_can_be_linked_and_both_reach_the_server

      - name: Upload failure diagnostics only
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-person-profile-failure
          path: |
            .tests/e2e-failure-diagnostics.json
            .tests/e2e-last-failed.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
