name: Advisory read-only Locust load pilot

# A bounded, manual load pilot against a disposable loopback --testing server
# with a synthetic library (#859, #765 T08). Not a PR gate: path-based gating
# needs separate stability evidence and maintainer approval.
on:
  workflow_dispatch:
    inputs:
      tier:
        description: Synthetic library tier
        type: choice
        options:
          - small
          - medium
        default: small

permissions:
  contents: read

concurrency:
  group: locust-readonly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readonly-load:
    name: Read-only Locust load pilot (advisory)
    runs-on: ubuntu-24.04
    # The pilot server runs PRKS_AUTH=loopback-owner on its own disposable
    # database of this PostgreSQL 18 server (tests/e2e/postgres_identity.py).
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PRKS_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
    timeout-minutes: 15
    steps:
      - name: Checkout PRKS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install isolated pinned load-pilot prerequisites
        run: python scripts/ci/install_pinned_python.py locust

      - name: Run the bounded read-only load pilot
        env:
          PRKS_TESTING: "1"
          TIER: ${{ inputs.tier || 'small' }}
        run: python scripts/ci/locust_pilot.py --tier "$TIER" --out locust-summary.json

      - name: Summarize the load pilot
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo "## Locust read-only load pilot (advisory)"
            echo "- Disposable loopback --testing server, synthetic library, 5 users, spawn rate 5, 30 s"
            echo "- GET only: catalog, Work detail, search, tags, research graph; every answer checked for meaning"
            echo "- Bounded summary below: no titles, ids, bodies or URLs with values"
            echo
            echo '```json'
            if [ -f locust-summary.json ]; then cat locust-summary.json; else echo '{"problems": ["no summary"]}'; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the bounded summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: locust-readonly-summary
          path: locust-summary.json
          if-no-files-found: ignore
          retention-days: 30
