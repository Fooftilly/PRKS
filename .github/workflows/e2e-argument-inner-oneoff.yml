name: Temporary Argument Overlay Inner Phase Probe

# One-off PR-branch diagnostic for #740. DELETE BEFORE MERGE.
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: temporary-argument-overlay-inner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    if: github.head_ref == 'test/e2e-argument-overlay-target-response-stage-740'
    name: Measure inner Argument verification stages (temporary)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Cache Playwright Chromium
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: .playwright-browsers
          key: >-
            playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt',
            'tests/e2e/install_browser.py') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install pinned runtime and E2E dependencies
        run: >-
          python -m pip install --isolated --disable-pip-version-check
          "--only-binary=:all:" "PyMuPDF==1.28.2" "Pillow==12.3.0" "pydantic==2.13.5"
          "playwright==1.63.0"
      - name: Ensure Chromium in repo cache
        run: python tests/e2e/install_browser.py
      - name: Profile exact-head isolated Chromium test
        shell: bash
        env:
          PRKS_E2E_PROFILE: "1"
          TARGET: tests.e2e.test_arguments_durable.DurableArgumentTests.test_pending_rename_reaches_position_argument_picker_and_graph
        run: |
          set -euo pipefail
          PRKS_E2E_BENCHMARK_RESULT="" \
            python tests/e2e/run.py --jobs 1 --no-pointer-capture --profile "$TARGET"
          for trial in 1 2 3; do
            echo "::group::Trial $trial"
            PRKS_E2E_BENCHMARK_RESULT="$RUNNER_TEMP/argument-inner-$trial.json" \
              python tests/e2e/run.py --jobs 1 --no-pointer-capture --profile "$TARGET"
            echo "::endgroup::"
          done
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from statistics import median

          root = Path(os.environ["RUNNER_TEMP"])
          records = [
              json.loads((root / f"argument-inner-{i}.json").read_text())
              for i in (1, 2, 3)
          ]
          names = [
              "arg_overlay_verify_target", "arg_overlay_target_write",
              "arg_overlay_target_navigate", "arg_overlay_target_visible",
              "arg_overlay_verify_response", "arg_overlay_response_write",
              "arg_overlay_response_navigate", "arg_overlay_response_visible",
              "arg_overlay_offline_rename", "arg_overlay_warm_argument_details",
          ]
          for i, r in enumerate(records, 1):
              if any(r.get(key) != value for key, value in (
                  ("tests", 1), ("failures", 0), ("errors", 0), ("skipped", 0)
              )):
                  raise SystemExit(f"Trial {i}: expected exactly 1 passing test")
              phases = r.get("phase_seconds", {})
              missing = set(names) - phases.keys()
              failed = [k for k in phases if k.startswith("arg_overlay_") and k.endswith("_failed")]
              if missing or failed:
                  raise SystemExit(f"Trial {i}: missing {sorted(missing)}, failed {failed}")
          lines = [
              "## Inner Argument rename propagation phase probe",
              "",
              "Exactly one excluded warm-up and 3 isolated Chromium measured runs.",
              "Parent verification phases INCLUDE write/navigate/visible timings.",
              "Do not add nested intervals to parent durations.",
              "",
              "| Phase | Median (seconds) | Individual runs (seconds) |",
              "| --- | ---: | --- |",
          ]
          for name in names:
              values = [float(r["phase_seconds"][name]) for r in records]
              lines.append(f"| `{name}` | {median(values):.3f} | "
                           + ", ".join(f"{v:.3f}" for v in values) + " |")
          walls = [float(r["wall_seconds"]) for r in records]
          lines.append(f"\nWhole test wall median: **{median(walls):.3f}s**.")
          report = "\n".join(lines) + "\n"
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(report)
          PY
