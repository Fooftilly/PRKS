name: Vitest coverage pilot

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/vitest-coverage-pilot.yml"
      - "frontend-app/src/lifecycle/tab-leave.ts"
      - "frontend-app/src/lifecycle/tab-leave.test.ts"
      - "frontend-app/src/lifecycle/owner-resource.ts"
      - "frontend-app/src/lifecycle/owner-resource.test.ts"
      - "frontend-app/src/query/retry.ts"
      - "frontend-app/src/query/retry.test.ts"
      - "frontend-app/src/workspace/transitions.ts"
      - "frontend-app/src/workspace/workspace.test.ts"
      - "frontend-app/vite.config.ts"
      - "frontend-app/package.json"
      - "frontend-app/package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vitest-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tab-leave-coverage:
    name: Vitest tab-leave coverage (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ">=24.15.0 <25"
          cache: npm
          cache-dependency-path: frontend-app/package-lock.json

      - name: Install locked frontend toolchain
        run: npm ci --ignore-scripts --no-audit --prefix frontend-app

      # The V8 provider is dev-only and locked alongside Vitest 5.0.2.
      - name: Run bounded Vitest line and branch coverage
        working-directory: frontend-app
        shell: bash
        run: |
          set -euo pipefail
          npm exec -- vitest run src/lifecycle/tab-leave.test.ts src/lifecycle/owner-resource.test.ts src/query/retry.test.ts src/workspace/workspace.test.ts \
            --coverage.enabled \
            --coverage.provider=v8 \
            --coverage.include='src/{lifecycle/tab-leave,lifecycle/owner-resource,query/retry,workspace/transitions}.ts' \
            --coverage.reporter=text \
            --coverage.reporter=json-summary \
            --coverage.reportsDirectory="$RUNNER_TEMP/prks-vitest-coverage"
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs'
          import { join } from 'node:path'

          const path = join(process.env.RUNNER_TEMP, 'prks-vitest-coverage', 'coverage-summary.json')
          const report = JSON.parse(readFileSync(path, 'utf8'))
          const modules = [
            'src/lifecycle/tab-leave.ts',
            'src/lifecycle/owner-resource.ts',
            'src/query/retry.ts',
            'src/workspace/transitions.ts',
          ]
          const actual = Object.entries(report).filter(([name]) => name !== 'total')
          if (actual.length !== modules.length) {
            throw new Error(`Expected exactly ${modules.length} source files; got ${actual.length}`)
          }
          const metrics = (value, name) => {
            if (!value?.lines || !value?.branches ||
                value.lines.total <= 0 || value.branches.total <= 0) {
              throw new Error(`Missing line or branch coverage for ${name}`)
            }
            return value
          }
          const perFile = modules.map((name) => {
            const match = actual.filter(([source]) => source.replaceAll('\\', '/').endsWith('/' + name))
            if (match.length !== 1) throw new Error(`Missing or duplicate coverage entry: ${name}`)
            return [name, metrics(match[0][1], name)]
          })
          const total = metrics(report.total, 'aggregate')
          for (const metric of ['lines', 'branches']) {
            const sum = perFile.reduce((n, [, counts]) => n + counts[metric].total, 0)
            const covered = perFile.reduce((n, [, counts]) => n + counts[metric].covered, 0)
            if (total[metric].total !== sum || total[metric].covered !== covered) {
              throw new Error(`Aggregate ${metric} count differs from the requested source files`)
            }
          }
          const format = (metric) =>
            `${metric.covered}/${metric.total} (${metric.pct.toFixed(1)}%)`
          const summary = [
            '## Vitest coverage pilot: four correctness modules',
            '',
            '| Module | Lines | Branches |',
            '| --- | ---: | ---: |',
            ...perFile.map(([name, counts]) =>
              `| \`${name}\` | ${format(counts.lines)} | ${format(counts.branches)} |`),
            `| **Total (these modules)** | **${format(total.lines)}** | **${format(total.branches)}** |`,
            '',
            'Informational only: no coverage thresholds; not frontend-wide coverage.',
            'Detailed data stays on the runner; no artifact upload.',
            '',
          ].join('\n')
          console.log(summary)
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary, 'utf8')
          NODE
