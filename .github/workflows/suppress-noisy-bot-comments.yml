name: Minimize noisy review bot comments

# Invariant (#363): review findings stay visible. High-confidence operational
# review-bot noise stays in GitHub history but is minimized as OFF_TOPIC.
# Nothing is ever deleted: this workflow has no content-deletion API path, and
# a failed minimization fails the job instead of falling back to anything else.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_run:
    workflows: ["Review event signal"]
    types: [completed]

permissions: {}

concurrency:
  # One queue per subject so a burst of different bot comments cannot cancel
  # each other's pending runs. Both values are GitHub-generated identifiers.
  group: minimize-noisy-review-bot-${{ github.event.comment.node_id || github.event.workflow_run.id }}
  cancel-in-progress: false

env:
  # The single classifier shared by both jobs and exercised by
  # tests/test_review_bot_noise_workflow.py. Input: a GitHub comment or review
  # object ({user: {login}, body}). Output: the matched rule name, or "none".
  #
  # Every rule requires the exact bot login AND every listed distinctive
  # fragment (or an explicit bot marker). Never add a rule that matches only
  # generic words such as "trial", "upgrade", "budget", "quota" or
  # "no issues": review findings, summaries and walkthroughs must stay visible.
  NOISE_CLASSIFIER_JQ: |
    [
      # Quota / rate-limit
      {
        rule: "codex-usage-limit",
        login: "chatgpt-codex-connector[bot]",
        fragments: ["You have reached your Codex usage limits", "code reviews"]
      },
      {
        rule: "greptile-credit-limit",
        login: "greptile-apps[bot]",
        fragments: [
          "has reached the 50-credit limit for trial accounts",
          "To continue receiving code reviews"
        ]
      },
      {
        rule: "sourcery-review-budget",
        login: "sourcery-ai[bot]",
        fragments: ["used your own review budget", "diff characters"]
      },
      # Subscription / trial / billing
      {
        rule: "greptile-trial-ended",
        login: "greptile-apps[bot]",
        fragments: ["Your trial has ended", "Reactivate Greptile"]
      },
      {
        rule: "qodo-trial-expiring",
        login: "qodo-code-review[bot]",
        fragments: ["<!-- qodo:trial-expiring -->"]
      },
      # Non-review status noise
      {
        rule: "coderabbit-auto-review-unavailable",
        login: "coderabbitai[bot]",
        fragments: ["does not receive automatic reviews", "fewer than 10 stars"]
      },
      # Benign no-findings messages explicitly selected as noise
      {
        rule: "qodo-no-findings",
        login: "qodo-code-review[bot]",
        fragments: [
          "Great, no issues found!",
          "Qodo reviewed your code and found no material issues that require review"
        ]
      }
    ] as $rules
    | (.user.login // "" | if type == "string" then . else "" end) as $login
    | (.body // "" | if type == "string" then . else "" end) as $body
    | first(
        $rules[]
        | select(.login == $login)
        | select(all(.fragments[]; . as $fragment | $body | contains($fragment)))
        | .rule
      ) // "none"

  # Reads the subject's current minimization state. A subject that is missing
  # or not Minimizable yields null, which the jobs treat as a failure.
  MINIMIZED_STATE_QUERY: |
    query($subjectId: ID!) {
      node(id: $subjectId) {
        ... on Minimizable {
          isMinimized
        }
      }
    }

  MINIMIZE_OFF_TOPIC_MUTATION: |
    mutation($subjectId: ID!) {
      minimizeComment(input: {subjectId: $subjectId, classifier: OFF_TOPIC}) {
        minimizedComment {
          isMinimized
        }
      }
    }

jobs:
  minimize-noise-comment:
    name: Minimize noisy bot comment
    # Comment events run in the base repository context. Only comments by the
    # known review bots on pull requests start this job; the classifier then
    # decides. The comment body is read from the event payload by jq as data
    # and never reaches a shell command or a ${{ }} expression in run:.
    if: >-
      (
        github.event_name == 'pull_request_review_comment' ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request)
      ) &&
      contains(
        fromJSON('["chatgpt-codex-connector[bot]","qodo-code-review[bot]","greptile-apps[bot]","sourcery-ai[bot]","coderabbitai[bot]"]'),
        github.event.comment.user.login
      )

    permissions:
      issues: write # minimizeComment on a PR conversation (issue) comment
      pull-requests: write # minimizeComment on an inline review comment

    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Minimize matched bot-noise comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rule="$(jq -c '.comment' "${GITHUB_EVENT_PATH}" | jq -r "${NOISE_CLASSIFIER_JQ}")"
          if [[ "${rule}" == "none" ]]; then
            echo "No high-confidence noise rule matched; leaving the comment visible."
            exit 0
          fi
          if [[ ! "${rule}" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::Unexpected classifier output" >&2
            exit 1
          fi

          # The event's own GraphQL node ID: IC_ for PR conversation comments,
          # PRRC_ for inline review comments.
          subject_id="$(jq -r '.comment.node_id // empty' "${GITHUB_EVENT_PATH}")"
          if [[ ! "${subject_id}" =~ ^(IC|PRRC)_[A-Za-z0-9_-]+$ ]]; then
            echo "::error::Missing or invalid comment node ID" >&2
            exit 1
          fi

          minimized_state() {
            gh api graphql \
              -f query="${MINIMIZED_STATE_QUERY}" \
              -f subjectId="${subject_id}" \
              --jq '.data.node.isMinimized'
          }

          before="$(minimized_state)"
          case "${before}" in
            true)
              echo "Rule ${rule}: ${subject_id} is already minimized."
              exit 0
              ;;
            false) ;;
            *)
              echo "::error::${subject_id} is missing or not minimizable" >&2
              exit 1
              ;;
          esac

          if ! gh api graphql \
            -f query="${MINIMIZE_OFF_TOPIC_MUTATION}" \
            -f subjectId="${subject_id}" > /dev/null
          then
            # A concurrent duplicate may have won; the re-read below decides.
            echo "::warning::minimizeComment returned an error; re-checking state"
          fi

          after="$(minimized_state)"
          if [[ "${after}" != "true" ]]; then
            echo "::error::Rule ${rule}: failed to minimize ${subject_id}" >&2
            exit 1
          fi
          echo "Rule ${rule}: minimized ${subject_id} as OFF_TOPIC."

  minimize-noisy-review:
    name: Minimize noisy bot review
    # Submitted reviews arrive through Review event signal. workflow_run always
    # executes this file from the default branch with the base repository's
    # token, even when the review was on a fork pull request, and nothing here
    # checks out or executes pull-request code. The signal run's title is the
    # only data taken from it, and it is accepted only as numeric IDs; the
    # review itself is re-fetched from GitHub and classified here.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request_review' &&
      github.event.workflow_run.conclusion == 'success'

    permissions:
      pull-requests: write # read the review and minimizeComment on it

    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Minimize matched bot-noise review
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SIGNAL_TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          set -euo pipefail

          # Review event signal encodes only GitHub numeric IDs in run-name.
          # Reject anything else rather than using untrusted text as API input.
          if [[ ! "${SIGNAL_TITLE}" =~ ^review-([0-9]+)-pr-([0-9]+)$ ]]; then
            echo "::error::Unexpected review signal title" >&2
            exit 1
          fi

          review_id="${BASH_REMATCH[1]}"
          pr_number="${BASH_REMATCH[2]}"

          review_json="$(mktemp)"
          trap 'rm -f "${review_json}"' EXIT

          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${REPOSITORY}/pulls/${pr_number}/reviews/${review_id}" \
            > "${review_json}"

          rule="$(jq -r "${NOISE_CLASSIFIER_JQ}" "${review_json}")"
          if [[ "${rule}" == "none" ]]; then
            echo "No high-confidence noise rule matched; leaving the review visible."
            exit 0
          fi
          if [[ ! "${rule}" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::Unexpected classifier output" >&2
            exit 1
          fi

          subject_id="$(jq -r '.node_id // empty' "${review_json}")"
          if [[ ! "${subject_id}" =~ ^PRR_[A-Za-z0-9_-]+$ ]]; then
            echo "::error::Missing or invalid review node ID" >&2
            exit 1
          fi

          minimized_state() {
            gh api graphql \
              -f query="${MINIMIZED_STATE_QUERY}" \
              -f subjectId="${subject_id}" \
              --jq '.data.node.isMinimized'
          }

          before="$(minimized_state)"
          case "${before}" in
            true)
              echo "Rule ${rule}: ${subject_id} is already minimized."
              exit 0
              ;;
            false) ;;
            *)
              echo "::error::${subject_id} is missing or not minimizable" >&2
              exit 1
              ;;
          esac

          if ! gh api graphql \
            -f query="${MINIMIZE_OFF_TOPIC_MUTATION}" \
            -f subjectId="${subject_id}" > /dev/null
          then
            # A concurrent duplicate may have won; the re-read below decides.
            echo "::warning::minimizeComment returned an error; re-checking state"
          fi

          after="$(minimized_state)"
          if [[ "${after}" != "true" ]]; then
            echo "::error::Rule ${rule}: failed to minimize ${subject_id}" >&2
            exit 1
          fi
          echo "Rule ${rule}: minimized ${subject_id} as OFF_TOPIC."
