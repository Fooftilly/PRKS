# Temporary read-only build-artifact bridge for PRKS #608.
# This workflow is removed after the generated assets are committed.
name: Temporary PRKS 608 Vue build
on:
  push:
    branches:
      - chatgpt/608-tags-alias-enter-20261107
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=24.15.0 <25"
          cache: npm
          cache-dependency-path: frontend-app/package-lock.json
      - name: Build production Vue artifacts with the pinned toolchain
        run: |
          npm ci --ignore-scripts --prefer-offline --no-audit --no-fund --prefix frontend-app
          npm run build --prefix frontend-app
      - name: Encode generated build diff as small JSON text records
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const paths = [
            'frontend/vue', 'frontend/js/workspace-model.js',
            'frontend/js/work-route-projection.js', 'frontend/js/search-query-codec.js',
            'frontend/js/tab-leave.js', 'frontend/js/owner-resource.js',
            'frontend/js/editor-recovery.js', 'frontend/js/route-model.js',
            'frontend/vendor/DEPENDENCY-MANIFEST.json', 'frontend/sw.js',
          ];
          const files = cp.execFileSync('git', ['diff', '--name-only', '--', ...paths],
            { encoding: 'utf8' }).split('\n').filter(Boolean);
          if (!files.includes('frontend/vue/prks-vue.js')) throw Error('Vue bundle was not regenerated');
          const payload = JSON.stringify({
            head: process.env.GITHUB_SHA,
            files: files.map(path => ({ path, content: fs.readFileSync(path, 'utf8') })),
          });
          const parts = [];
          for (let i = 0; i < payload.length; i += 450) {
            parts.push(JSON.stringify(payload.slice(i, i + 450)));
          }
          fs.mkdirSync('.prks-build-artifact', { recursive: true });
          fs.writeFileSync('.prks-build-artifact/generated-assets.jsonl', parts.join('\n') + '\n');
          console.log('Prepared', files.length, 'generated files in', parts.length, 'text records');
          NODE
      - name: Upload deterministic build output for source-branch commit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prks-608-generated-assets
          path: .prks-build-artifact/generated-assets.jsonl
          archive: false
          if-no-files-found: error
          retention-days: 1
