name: CodeQL

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  schedule:
    - cron: "42 18 * * 2"

  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none

          - language: javascript-typescript
            build-mode: none

          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Classify documentation-only PR (fail closed)
        id: docs-scope
        shell: bash
        env:
          PRKS_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PRKS_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          docs_only=false
          if [[ "$PRKS_EVENT_NAME" == "pull_request" && "$PRKS_PR_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            if git fetch --no-tags --depth=1 origin "$PRKS_PR_BASE_SHA"; then
              # The PR checkout is untrusted: use the reviewed classifier from
              # the immutable base, not the PR's possibly modified selector.
              if base_classifier="$(mktemp)"; then
                if git show "$PRKS_PR_BASE_SHA:scripts/ci/docs_only.py" > "$base_classifier"; then
                  decision="$(python "$base_classifier" --base "$PRKS_PR_BASE_SHA")" || decision=false
                  if [[ "$decision" == "true" ]]; then
                    docs_only=true
                  fi
                else
                  echo "::warning::Docs classifier absent from base; running full tests."
                fi
                rm -f "$base_classifier"
              else
                echo "::warning::Failed to allocate classifier file; running full tests."
              fi
            else
              echo "::warning::Could not fetch immutable PR base; running full tests."
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

      - name: Initialize CodeQL
        if: steps.docs-scope.outputs.docs_only != 'true'
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config: |
            paths-ignore:
              - frontend/vendor/**

      - name: Perform CodeQL Analysis
        if: steps.docs-scope.outputs.docs_only != 'true'
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
