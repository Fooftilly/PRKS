# One-off maintenance task: reconcile generated vendor assets with moving master.
name: One-shot Lucide generated artifact master sync 1098
on:
  push:
    branches:
      - dependabot/npm_and_yarn/tools/frontend-vendor/frontend-vendor-routine-57aafb71d5
    paths:
      - .github/workflows/dependency-artifact-sync-1098.yml
permissions:
  contents: write
jobs:
  sync:
    if: github.repository == 'Fooftilly/PRKS'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Validate exact reviewed head
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "dependabot/npm_and_yarn/tools/frontend-vendor/frontend-vendor-routine-57aafb71d5"
          test "$(git rev-parse HEAD^)" = "707f6f548ae89e76bd17cce1d35270a6ef86dad0"
      - name: Merge current master with guarded generated-asset conflict resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PRKS dependency maintainer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin master
          if ! git merge --no-commit --no-ff origin/master; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            test "${#conflicts[@]}" -gt 0
            for f in "${conflicts[@]}"; do
              case "$f" in
                frontend/sw.js|frontend/vendor/DEPENDENCY-MANIFEST.json) ;;
                *) echo "Unexpected conflict: $f" >&2; exit 1 ;;
              esac
            done
            git checkout --theirs -- "${conflicts[@]}"
            git add -- "${conflicts[@]}"
          fi
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Rebuild master-integrated vendor assets and verify the gate
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/refresh_dependency_artifacts.sh frontend-vendor
      - name: Commit integration and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PRKS dependency maintainer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- frontend/
          git rm -- .github/workflows/dependency-artifact-sync-1098.yml
          git commit -m "build(deps): reconcile Lucide generated assets with master"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
