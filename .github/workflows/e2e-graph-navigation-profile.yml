name: E2E Offline Graph Navigation Profile

# Diagnostic only. No PR/master trigger or automatic runner-minute cost.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Which source-Chromium diagnosis to run"
        type: choice
        required: false
        default: graph
        options:
          - graph
          - person_retry_ab

permissions:
  contents: read

concurrency:
  group: e2e-graph-navigation-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  profile:
    name: Profile real Chromium Graph round trips
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Cache Playwright Chromium
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: .playwright-browsers
          key: >-
            playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt',
            'tests/e2e/install_browser.py') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install runtime and E2E dependencies
        run: >-
          python -m pip install --isolated --disable-pip-version-check
          "--only-binary=:all:" "PyMuPDF==1.28.2" "Pillow==12.3.0" "pydantic==2.13.5"
          "playwright==1.63.0"

      - name: Ensure Chromium in repo cache
        run: python tests/e2e/install_browser.py

      - name: Profile isolated Graph navigation with one unmeasured warm-up
        if: ${{ inputs.mode != 'person_retry_ab' }}
        shell: bash
        env:
          PRKS_E2E_PROFILE: "1"
          TARGET: tests.e2e.test_research_graph_offline.ResearchGraphOfflineTests.test_record_graph_navigation_both_directions
        run: |
          set -euo pipefail
          # Warm runner/browser imports once, excluding the warm-up's timings.
          PRKS_E2E_BENCHMARK_RESULT="" \
            python tests/e2e/run.py --jobs 1 --no-pointer-capture --profile "$TARGET"

          for trial in 1 2 3; do
            echo "::group::Profile iteration $trial"
            result_file="$RUNNER_TEMP/graph-profile-$trial.json"
            rm -f "$result_file"
            PRKS_E2E_BENCHMARK_RESULT="$result_file" \
              python tests/e2e/run.py --jobs 1 --no-pointer-capture --profile "$TARGET"
            echo "::endgroup::"
          done

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from statistics import median

          root = Path(os.environ["RUNNER_TEMP"])
          results = [json.loads((root / f"graph-profile-{i}.json").read_text())
                     for i in (1, 2, 3)]
          if any(r["tests"] != 1 or r["failures"] or r["errors"] or r["skipped"]
                 for r in results):
              raise SystemExit("Graph profile does not contain three passing single-test runs")

          expected = {
              "graph_nav_initial_setup",
              "graph_nav_warm_record_cache",
              "graph_nav_warm_graph_cache",
              "graph_nav_go_offline",
              "graph_nav_roundtrip_1_concept",
              "graph_nav_roundtrip_2_position",
              "graph_nav_roundtrip_3_argument",
              "graph_nav_roundtrip_4_argument",
              "graph_nav_roundtrip_5_person",
              "graph_nav_uncached_destination",
              "graph_nav_uncached_graph",
          }
          # This diagnostic exists to attribute the Person return delay.
          # Treat all nine core/envelope/reader functions as required, including
          # zero-duration synchronous steps (emitted with a tiny recording
          # floor by the test). Never publish a "passing" partial profile.
          person_stages = {
              "route_total", "route_commit", "durable_operations",
              "detail_fetch", "offline_reader", "effective_person", "pending_metadata",
              "person_render", "banner_insertion",
          }
          expected.update(
              f"graph_nav_person_route_{stage}_{aggregate}"
              for stage in person_stages for aggregate in ("sum", "max")
          )
          # A missing phase or a merged Argument pair invalidates the profile;
          # never interpret a partial report's zero as a successful fast phase.
          for i, result in enumerate(results, start=1):
              phases = result["phase_seconds"]
              missing = expected - phases.keys()
              if missing:
                  raise SystemExit(
                      f"Graph profile trial {i} missing phases: {sorted(missing)}"
                  )
              failures = [name for name in phases
                          if name.startswith("graph_nav_") and name.endswith("_failed")]
              if failures:
                  raise SystemExit(f"Graph profile trial {i} failed phases: {failures}")
          # Detail-stage timers are optional: older profiler checkouts did not
          # record them. Show them only when *every* trial measured the phase;
          # a missing key must never masquerade as an instant zero-second step.
          optional = {
              name for result in results for name in result["phase_seconds"]
              if name.startswith("graph_nav_") and name not in expected
          }
          complete_optional = {name for name in optional
                               if all(name in result["phase_seconds"] for result in results)}
          names = sorted(expected | complete_optional)
          summary = [
              "## Offline Graph navigation phase profile",
              "",
              "Source checkout, same hosted runner, one warm-up excluded, three passing serial repeats.",
              "Roundtrip totals *include* enter/to_graph/return stages; do not add them.",
              "Graph diagnostics also overlap generic infrastructure/async waits.",
              "",
              "| Phase | Median (s) | Runs (s) |",
              "| --- | ---: | --- |",
          ]
          incomplete = optional - complete_optional
          if incomplete:
              summary.insert(5, f"Incomplete optional phases omitted: {sorted(incomplete)}")
          for name in names:
              values = [float(r["phase_seconds"][name]) for r in results]
              summary.append(
                  f"| `{name}` | {median(values):.3f} | " +
                  ", ".join(f"{x:.3f}" for x in values) + " |"
              )
          wall = [float(r["wall_seconds"]) for r in results]
          summary.extend(["", f"Full single-test wall median: **{median(wall):.3f}s**.",
                          "Do not compare profile-mode times directly to ordinary unprofiled CI."])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(summary) + "\n")
          print("\n".join(summary))
          PY

      - name: Compare Person retry policies in real offline Chromium
        if: ${{ inputs.mode == 'person_retry_ab' }}
        shell: bash
        env:
          TARGET: tests.e2e.profile_person_retry_ab.PersonReconnectRetryExperiment.test_cached_person_reader_retry_policy_ab
        run: |
          set -euo pipefail
          # Do not include first-import/browser runner effects in comparisons.
          PRKS_E2E_BENCHMARK_RESULT="" \
            python tests/e2e/run.py --jobs 1 --no-pointer-capture --profile "$TARGET"

          for trial in 1 2 3; do
            echo "::group::Retry A/B trial $trial"
            result_file="$RUNNER_TEMP/person-retry-ab-$trial.json"
            rm -f "$result_file"
            PRKS_E2E_BENCHMARK_RESULT="$result_file" \
              python tests/e2e/run.py --jobs 1 --no-pointer-capture --profile "$TARGET"
            echo "::endgroup::"
          done

          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from statistics import median

          root = Path(os.environ["RUNNER_TEMP"])
          results = [
              json.loads((root / f"person-retry-ab-{i}.json").read_text())
              for i in (1, 2, 3)
          ]
          expected = {
              "person_reconnect_retry_default",
              "person_reconnect_retry_single",
          }
          for i, r in enumerate(results, start=1):
              if r["tests"] != 1 or r["failures"] or r["errors"] or r["skipped"]:
                  raise SystemExit(f"Person retry A/B trial {i} not a passing single test")
              phases = r["phase_seconds"]
              if not expected <= phases.keys() or any(float(phases[n]) <= 0 for n in expected):
                  raise SystemExit(f"Person retry A/B trial {i} missing positive phase values")
          default = [float(r["phase_seconds"]["person_reconnect_retry_default"])
                     for r in results]
          single = [float(r["phase_seconds"]["person_reconnect_retry_single"])
                    for r in results]
          message = [
              "## Manual Person retry-policy A/B (offline cached detail)",
              "",
              "Real Chromium + PRKS source, one excluded warm-up, three serial runs.",
              "Each run compares two default reads and two single-attempt reads",
              "in A-B-B-A order, after verified offline cache warming.",
              "Both modes start while the runtime is reconnecting, issue a",
              "real Person GET and return cached fallback; request attempts",
              "are asserted as 3 vs 1, respectively.",
              "",
              "| Policy | Median of trial medians (s) | Trial medians (s) |",
              "| --- | ---: | --- |",
              f"| Standard retries | {median(default):.3f} | " +
                  ", ".join(f"{x:.3f}" for x in default) + " |",
              f"| One attempt | {median(single):.3f} | " +
                  ", ".join(f"{x:.3f}" for x in single) + " |",
              "",
              "Diagnostic only: no production retry-policy changes.",
              "One-attempt behavior is less resilient to transient failures;",
              "these offline-only timings do not establish reconnect correctness.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(message) + "\n")
          print("\n".join(message))
          PY

      - name: Upload failure diagnosis only
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-graph-profile-failure
          path: |
            .tests/e2e-failure-diagnostics.json
            .tests/e2e-last-failed.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
