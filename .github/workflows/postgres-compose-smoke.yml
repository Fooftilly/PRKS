name: PostgreSQL Compose acceptance

# Non-required L-D-1 deployment acceptance (#630): the docker-compose.postgres.yml
# stack (db, migrate, web, worker) through first-run setup, restarts, an
# upgrade-style migrate, a stale database copy, a crashed start-generation bump
# and a recreated database volume. See scripts/ci/test_postgres_compose.sh.
on:
  pull_request:
    paths:
      - docker-compose.yml
      - docker-compose.postgres.yml
      - .dockerignore
      - Dockerfile
      - requirements.txt
      - prks_app.py
      - backend/process_roles.py
      - backend/readiness.py
      - backend/db/**
      - backend/domain/identity/**
      - backend/jobs/worker.py
      - backend/storage/root_binding.py
      - backend/storage/root_marker.py
      - backend/storage/file_lock.py
      - scripts/ci/test_postgres_compose.sh
      - .github/workflows/postgres-compose-smoke.yml
  push:
    branches:
      - master
    paths:
      - docker-compose.yml
      - docker-compose.postgres.yml
      - .dockerignore
      - Dockerfile
      - requirements.txt
      - prks_app.py
      - backend/process_roles.py
      - backend/readiness.py
      - backend/db/**
      - backend/domain/identity/**
      - backend/jobs/worker.py
      - backend/storage/root_binding.py
      - backend/storage/root_marker.py
      - backend/storage/file_lock.py
      - scripts/ci/test_postgres_compose.sh
      - .github/workflows/postgres-compose-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-compose-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-compose:
    name: PostgreSQL Compose acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the PostgreSQL Compose stack through its acceptance checks
        shell: bash
        run: bash scripts/ci/test_postgres_compose.sh
