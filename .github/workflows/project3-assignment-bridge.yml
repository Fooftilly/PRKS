name: Project 3 assignment bridge

# The ChatGPT GitHub connector can submit an authenticated issue comment, but
# cannot write Project V2 custom fields directly. A comment on inbox issue
# #982 is a transport command, NOT automatically trusted code. The Python
# bridge fetches it again through REST and validates the owner's user ID,
# originating GitHub App ID, exact command body, freshness, and replay state.
on:
  issue_comment:
    types: [created]

permissions: {}

# Serialize with comment-free dispatch requests; claim comments remain single-use.
concurrency:
  group: project3-assignment-mutations
  cancel-in-progress: false
  queue: max

jobs:
  assignment:
    if: >-
      github.repository == 'Fooftilly/PRKS' &&
      github.ref == 'refs/heads/master' &&
      github.actor == 'Fooftilly' &&
      github.event.issue.number == 982 &&
      !github.event.issue.pull_request &&
      startsWith(github.event.comment.body, 'PRKS_PROJECT3_ASSIGN_V1')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: project-automation
    permissions:
      contents: read
      issues: write
      actions: write
    steps:
      # issue_comment always runs from default branch, never untrusted PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate command and update Project #3 when enabled
        env:
          PROJECT_SYNC_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PROJECT3_ASSIGN_BRIDGE_MODE: ${{ vars.PROJECT3_ASSIGN_BRIDGE_MODE }}
        run: python3 scripts/project3_command_bridge.py

      # Only a successful, authenticated command requests an immediate queue
      # refresh. workflow_dispatch is an explicit GITHUB_TOKEN event exception;
      # unlike workflow_run it never consumes an untrusted upstream artifact.
      - name: Refresh the public agent ownership queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run project3-agent-queue.yml --repo Fooftilly/PRKS --ref master
