name: Temporary Vue dependency artifact refresh
on:
  push:
    branches:
      - 'dependabot/npm_and_yarn/frontend-app/frontend-routine-1f340f0a0c'
permissions:
  contents: write
jobs:
  refresh:
    if: github.ref == 'refs/heads/dependabot/npm_and_yarn/frontend-app/frontend-routine-1f340f0a0c'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout dependency branch without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Regenerate and validate Vue artifacts
        run: bash scripts/refresh_dependency_artifacts.sh frontend-app
      - name: Commit refreshed Vue files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- frontend/vue frontend/js/workspace-model.js frontend/js/work-route-projection.js frontend/js/search-query-codec.js frontend/js/tab-leave.js frontend/js/owner-resource.js frontend/js/editor-recovery.js frontend/js/route-model.js frontend/vendor/DEPENDENCY-MANIFEST.json frontend/sw.js frontend-app/THIRD_PARTY_LICENSES.md
          if git diff --cached --quiet; then
            echo "No updated Vue artifacts"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(deps): regenerate frontend artifacts for routine updates'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:${GITHUB_REF_NAME}"
