name: PRKS Test Gate

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: test-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-api-contract:
    permissions:
      contents: read
    name: Unit / API / contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install pinned runtime dependencies
        # Keep versions in sync with requirements.txt. Explicit package== pins
        # plus --only-binary satisfy Sonar githubactions:S8541 / S8544; -r alone
        # is treated as an unlocked install by those rules. --isolated ignores
        # PIP_* env / user config (PIP_REQUIREMENT, PIP_EDITABLE, …).
        run: >-
          python -m pip install --isolated --disable-pip-version-check
          "--only-binary=:all:" "PyMuPDF==1.28.2" "Pillow==12.3.0" "pydantic==2.13.5"

      - name: Run PRKS unit, API, structural, and Node tests
        run: python run_tests.py
