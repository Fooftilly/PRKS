name: PRKS Test Gate

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  # Off-peak weekday testing for Mergify flaky-test detection.
  # Time zone observes CET/CEST automatically; 03:17 avoids the DST switch hour.
  schedule:
    - cron: "17 3 * * 1-5"
      timezone: Europe/Podgorica

concurrency:
  # Never let the nightly scan cancel an in-progress master push gate.
  # Isolate scheduled runs so master pushes cannot cancel the scan either.
  group: test-gate-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-api-contract:
    permissions:
      contents: read
    name: Unit / API / contract tests
    runs-on: ubuntu-latest
    # Three full suites take longer than the single required PR/master run.
    timeout-minutes: ${{ github.event_name == 'schedule' && 45 || 20 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install pinned runtime dependencies
        # Keep versions in sync with requirements.txt, plus openapi-core from
        # requirements-dev.txt so Positions contract validation is non-optional
        # in this job (#180). Explicit package== pins plus --only-binary satisfy
        # Sonar githubactions:S8541 / S8544; -r alone is treated as an unlocked
        # install by those rules. --isolated ignores PIP_* env / user config
        # (PIP_REQUIREMENT, PIP_EDITABLE, …).
        run: >-
          python -m pip install --isolated --disable-pip-version-check
          "--only-binary=:all:" "PyMuPDF==1.28.2" "Pillow==12.3.0" "pydantic==2.13.5"
          "openapi-core==0.23.1"

      - name: Run PRKS unit, API, structural, and Node tests
        id: tests
        env:
          PRKS_JUNIT_REPORT: test-reports/unit.xml
          # The Python runner spawns three fresh unit processes only overnight.
          # Keep the approved command unchanged for the dependency gate (#180).
          PRKS_UNIT_REPETITIONS: ${{ github.event_name == 'schedule' && '3' || '1' }}
        run: python run_tests.py

      # Upload test-level outcomes only. The reporter excludes traces and output.
      # Non-blocking: third-party outages must not change the required Test Gate.
      - name: Report unit test results to Mergify
        if: >-
          (success() || failure()) && !cancelled() &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: Mergifyio/gha-mergify-ci@392d123d84a27960993927aec1f2cbb059fb95c1 # v27
        with:
          action: junit-process
          token: ${{ secrets.MERGIFY_TOKEN }}
          # Single report on PR/push; three reports on the scheduled run.
          report_path: 'test-reports/unit*.xml'
          test_step_outcome: ${{ steps.tests.outcome }}

  postgres-helpers:
    # Nightly detection only repeats the unit suite, not PostgreSQL jobs.
    if: github.event_name != 'schedule'
    permissions:
      contents: read
    name: PostgreSQL helper tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Disposable PostgreSQL 18 with the builtin locale (docs/postgresql-architecture.md
    # §13.1). The harness only uses its `postgres` maintenance database to create
    # and drop its own prks_test_* databases. Trust auth: the port is bound on the
    # runner only and the server is discarded with the job.
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned runtime and PostgreSQL dependencies
        # Runtime pins from requirements.txt plus the psycopg (#623) and
        # argon2-cffi (#626) pins from requirements-dev.txt. Explicit
        # package== pins plus --only-binary, as in the unit job above.
        run: >-
          python -m pip install --isolated --disable-pip-version-check
          "--only-binary=:all:" "PyMuPDF==1.28.2" "Pillow==12.3.0" "pydantic==2.13.5"
          "psycopg==3.3.6" "psycopg-binary==3.3.6" "psycopg-pool==3.3.3"
          "argon2-cffi==25.1.0"

      - name: Run PostgreSQL helper and harness tests
        env:
          PRKS_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        run: scripts/test-postgres

  backend-parity:
    if: github.event_name != 'schedule'
    permissions:
      contents: read
    name: Backend parity (SQLite + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Runs the test modules that opt into tests/backend_parity.py on both
    # legs and reports the facade's ported/unported counts (#625, PG-3,
    # docs/postgresql-architecture.md §13.1). Same disposable server as the
    # PostgreSQL helper job above.
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned runtime and PostgreSQL dependencies for parity
        # Same pins as the PostgreSQL helper job: requirements.txt plus the
        # psycopg and argon2-cffi pins from requirements-dev.txt.
        run: >-
          python -m pip install --isolated --disable-pip-version-check
          "--only-binary=:all:" "PyMuPDF==1.28.2" "Pillow==12.3.0" "pydantic==2.13.5"
          "psycopg==3.3.6" "psycopg-binary==3.3.6" "psycopg-pool==3.3.3"
          "argon2-cffi==25.1.0"

      - name: Run SQLite and PostgreSQL backend parity legs
        # Fails on any failure in either leg; skipped (unported) PostgreSQL
        # tests are reported, never counted as passes. The summary is also
        # written to the job summary.
        env:
          PRKS_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        run: scripts/test-postgres --parity
