name: Publish Wiki

on:
  push:
    branches: [master]
    paths:
      - "docs/wiki/**"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wiki-${{ github.repository }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out canonical documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false

      - name: Publish docs/wiki to GitHub Wiki
        env:
          GH_TOKEN: ${{ github.token }}
          WIKI_BASE_URL: https://github.com/${{ github.repository }}/wiki
        shell: bash
        run: |
          set -euo pipefail

          wiki_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          if ! git clone --depth 1 "$wiki_url" .wiki; then
            echo "::error::Unable to clone the GitHub Wiki repository."
            echo "::error::If this is the first publication, create the initial Wiki page in GitHub once, then rerun this workflow."
            exit 1
          fi

          find .wiki -maxdepth 1 -type f -name '*.md' -delete
          for source in docs/wiki/*.md; do
            if [[ "$(basename "$source")" == "README.md" ]]; then
              continue
            fi
            cp "$source" ".wiki/$(basename "$source")"
          done

          # Repository source keeps *.md links so docs/wiki is browsable in normal
          # GitHub code views. Rewrite only the published copy to Wiki page URLs.
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          wiki_dir = Path(".wiki")
          wiki_base = os.environ["WIKI_BASE_URL"].rstrip("/")
          link_re = re.compile(
              r"(?P<prefix>\]\()(?P<page>[A-Za-z0-9_-]+)\.md"
              r"(?P<anchor>#[^)]*)?(?P<suffix>\))"
          )

          for path in wiki_dir.glob("*.md"):
              content = path.read_text(encoding="utf-8")
              content = link_re.sub(
                  lambda match: (
                      f'{match.group("prefix")}{wiki_base}/{match.group("page")}'
                      f'{match.group("anchor") or ""}{match.group("suffix")}'
                  ),
                  content,
              )
              path.write_text(content, encoding="utf-8")

          relative_md_link = re.compile(
              r"\]\((?!https?://|mailto:|#)[^)]+\.md(?:#[^)]*)?\)"
          )
          unresolved = []
          for path in wiki_dir.glob("*.md"):
              for match in relative_md_link.finditer(path.read_text(encoding="utf-8")):
                  unresolved.append(f"{path.name}: {match.group(0)}")

          if unresolved:
              raise SystemExit(
                  "Published wiki still contains repository-style Markdown links:\n"
                  + "\n".join(unresolved)
              )
          PY

          cd .wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Wiki already matches docs/wiki."
            exit 0
          fi

          git commit -m "docs: sync wiki from ${GITHUB_SHA}"
          git push origin HEAD:master
