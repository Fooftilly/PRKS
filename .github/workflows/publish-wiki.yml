name: Publish Wiki

on:
  push:
    branches: [master]
    paths:
      - "docs/wiki/**"
      - ".github/workflows/publish-wiki.yml"
      - "scripts/ci/wiki_links.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Do not cancel a run that may already be pushing: a cancelled push can still
  # land, leaving the next run to push from a revision it no longer descends
  # from. Runs queue instead, and each one mirrors the current master.
  group: publish-wiki-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out canonical documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          persist-credentials: false

      - name: Publish docs/wiki to GitHub Wiki
        env:
          GH_TOKEN: ${{ github.token }}
          WIKI_BASE_URL: https://github.com/${{ github.repository }}/wiki
        shell: bash
        run: |
          set -euo pipefail

          wiki_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          # 0 published (or already current), 1 push rejected (retryable),
          # 2 fatal. The whole mirror is rebuilt from master on every attempt,
          # so retrying after a rejected push is safe and idempotent.
          publish_attempt() {
            rm -rf .wiki

            if ! git clone --depth 1 "$wiki_url" .wiki; then
              echo "::error::Unable to clone the GitHub Wiki repository."
              echo "::error::If this is the first publication, create the initial Wiki page in GitHub once, then rerun this workflow."
              return 2
            fi

            find .wiki -maxdepth 1 -type f -name '*.md' -delete || return 2
            for source in docs/wiki/*.md; do
              if [[ "$(basename "$source")" == "README.md" ]]; then
                continue
              fi
              cp "$source" ".wiki/$(basename "$source")" || return 2
            done

            # Rewrite only the published copy's links to Wiki page URLs and stop on
            # repository-style links (see scripts/ci/wiki_links.py).
            python3 scripts/ci/wiki_links.py .wiki || return 2

            git -C .wiki config user.name "github-actions[bot]" || return 2
            git -C .wiki config user.email "41898282+github-actions[bot]@users.noreply.github.com" || return 2
            git -C .wiki add -A || return 2

            if git -C .wiki diff --cached --quiet; then
              echo "Wiki already matches docs/wiki."
              return 0
            fi

            git -C .wiki commit -m "docs: sync wiki from ${GITHUB_SHA}" || return 2

            if git -C .wiki push origin HEAD:master; then
              return 0
            fi

            return 1
          }

          max_attempts=3
          attempt=1

          while true; do
            if publish_attempt; then
              break
            else
              status=$?
            fi

            if [[ "$status" -ne 1 ]]; then
              exit "$status"
            fi

            if [[ "$attempt" -ge "$max_attempts" ]]; then
              echo "::error::Wiki push was rejected after ${max_attempts} attempts."
              exit 1
            fi

            echo "Wiki push rejected, most likely by a concurrent publish. Re-cloning and retrying."
            attempt=$((attempt + 1))
            sleep $((attempt * 3))
          done
