name: Fast Static Analysis

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUFF_VERSION: "0.16.8"
  PYRIGHT_VERSION: "1.1.414"
  ESLINT_VERSION: "10.10.0"

jobs:
  ruff:
    name: Ruff bug checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check "ruff==${RUFF_VERSION}"

      - name: Run high-signal Python checks
        run: ruff check --config ruff.toml .

  pyright:
    name: Pyright production types
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install PRKS runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run Pyright
        run: npm exec --yes --package="pyright@${PYRIGHT_VERSION}" -- pyright --project pyrightconfig.json

  eslint:
    name: ESLint bug checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run high-signal JavaScript checks
        run: npm exec --yes --package="eslint@${ESLINT_VERSION}" -- eslint --config eslint.config.mjs frontend tests/browser
