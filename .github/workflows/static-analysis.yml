name: Fast Static Analysis

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: static-analysis-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUFF_VERSION: "0.16.8"
  PYRIGHT_VERSION: "1.1.414"
  ESLINT_VERSION: "10.10.0"

jobs:
  ruff:
    permissions:
      contents: read
    name: Ruff bug checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need the PR base (or push before SHA) so the E2E wait_for_timeout
          # guard can diff only *new* call sites (#189).
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check "--only-binary=:all:" "ruff==${RUFF_VERSION}"

      - name: Run high-signal Python checks
        run: ruff check --config ruff.toml prks_app.py backend

      - name: Enforce PRKS engineering invariants
        run: python scripts/check_invariants.py

      - name: Fail on new E2E page.wait_for_timeout
        # Diff-aware (#189): historical sleeps under tests/e2e/ do not fail
        # unrelated PRs. Only newly added unapproved call sites fail.
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base="${{ github.event.before }}"
          else
            # workflow_dispatch / first push: compare to parent when available.
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          python scripts/check_e2e_wait_for_timeout.py --base "$base"

  pyright:
    permissions:
      contents: read
    name: Pyright data-flow checks
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Run Pyright
        run: npm exec --yes --ignore-scripts --package="pyright@${PYRIGHT_VERSION}" -- pyright --project pyrightconfig.json

  eslint:
    permissions:
      contents: read
    name: ESLint bug checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Run high-signal JavaScript checks
        run: npm exec --yes --ignore-scripts --package="eslint@${ESLINT_VERSION}" -- eslint --config eslint.config.mjs frontend tests/browser
