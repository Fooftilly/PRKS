name: Fast Static Analysis

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: static-analysis-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUFF_VERSION: "0.16.8"
  PYRIGHT_VERSION: "1.1.414"
  ESLINT_VERSION: "10.10.0"

jobs:
  ruff:
    permissions:
      contents: read
    name: Ruff bug checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need the PR base (or push before SHA) so the E2E wait_for_timeout
          # guard can diff only *new* call sites (#189).
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install --disable-pip-version-check "--only-binary=:all:" "ruff==${RUFF_VERSION}"

      - name: Run high-signal Python checks
        run: ruff check --config ruff.toml prks_app.py backend

      - name: Enforce PRKS engineering invariants
        run: python scripts/check_invariants.py

      - name: Resolve diff-aware check base
        id: diff-base
        # Shared by the diff-aware guards below (#189, #190, #192).
        # PR base is the immutable event SHA (not the live base-branch tip).
        # Zero-before pushes (new/recreated branch) use the empty tree so the
        # full tip is scanned — do not merge-base with origin/master after a
        # master push (that ref can equal HEAD and skip newly pushed history).
        # workflow_dispatch compares against HEAD so grandfathered historical
        # waits stay grandfathered (empty tree would fail the whole corpus).
        shell: bash
        env:
          PRKS_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PRKS_PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          empty_tree="4b825dc642cb6eb9a060e54bf8d6927f8d2765b5"
          zero_sha="0000000000000000000000000000000000000000"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${PRKS_PR_BASE_SHA:?missing pull_request.base.sha}"
            git fetch --no-tags --depth=1 origin "$base"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            if [[ -n "${PRKS_PUSH_BEFORE:-}" && "${PRKS_PUSH_BEFORE}" != "$zero_sha" ]]; then
              base="$(git rev-parse --verify --end-of-options "${PRKS_PUSH_BEFORE}")"
            else
              # Parentless / new-branch push: scan full tip vs empty tree.
              base="$empty_tree"
            fi
          else
            # workflow_dispatch (and any other non-PR/non-push event): no-new-
            # change baseline so historical E2E waits remain grandfathered.
            base="$(git rev-parse --verify --end-of-options HEAD)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Fail on new E2E page.wait_for_timeout
        # Diff-aware (#189): historical sleeps under tests/e2e/ do not fail
        # unrelated PRs. Only newly added / newly-unexempted call sites fail.
        env:
          PRKS_DIFF_BASE: ${{ steps.diff-base.outputs.base }}
        run: python scripts/check_e2e_wait_for_timeout.py --base "$PRKS_DIFF_BASE"

      - name: Schema-change gate (db_schema + migration + version + PK parity)
        # #190: a db_schema.sql change needs a LATEST_SCHEMA_VERSION bump and
        # one new Migration per bumped version; ON CONFLICT tables in the
        # canonical schema must be in _CURRENT_TABLE_PKS (or the narrow
        # allowlist in the script). Non-schema PRs pass unchanged.
        env:
          PRKS_DIFF_BASE: ${{ steps.diff-base.outputs.base }}
        run: python scripts/check_schema_change.py --base "$PRKS_DIFF_BASE"

      - name: Fail on new correlated catalogue COUNT SQL
        # #192: per-row correlated (SELECT COUNT(...) ... = outer.id) scalar
        # subqueries in backend/ + prks_app.py must match a grandfathered
        # entry in scripts/correlated_catalog_counts_allowlist.json whose
        # query already existed at the diff base. New debt fails; fixed debt
        # leaves a stale entry that fails until removed.
        env:
          PRKS_DIFF_BASE: ${{ steps.diff-base.outputs.base }}
        run: python scripts/check_correlated_catalog_counts.py --base "$PRKS_DIFF_BASE"

  pyright:
    permissions:
      contents: read
    name: Pyright data-flow + typed storage slice
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # Narrow diagnostics across prks_app.py + backend (typeCheckingMode: off).
      - name: Run Pyright data-flow checks
        run: npm exec --yes --ignore-scripts --package="pyright@${PYRIGHT_VERSION}" -- pyright --project pyrightconfig.json

      # Genuine basic type checking for the first #69 slice: backend/storage.
      - name: Run Pyright typed slice (backend/storage, basic)
        run: npm exec --yes --ignore-scripts --package="pyright@${PYRIGHT_VERSION}" -- pyright --project pyrightconfig.typed-slice.json

  eslint:
    permissions:
      contents: read
    name: ESLint bug checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Run high-signal JavaScript checks
        run: npm exec --yes --ignore-scripts --package="eslint@${ESLINT_VERSION}" -- eslint --config eslint.config.mjs frontend tests/browser

  vue:
    permissions:
      contents: read
    name: Vue typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ">=24.15.0 <25"
          cache: npm
          cache-dependency-path: frontend-app/package-lock.json

      - name: Install Vue toolchain from the lockfile
        run: npm ci --ignore-scripts --prefix frontend-app

      - name: Typecheck
        run: npm run typecheck --prefix frontend-app

      - name: Vitest
        run: npm test --prefix frontend-app

      - name: Production build matches committed assets
        run: |
          set -euo pipefail
          npm run build --prefix frontend-app
          git diff --exit-code -- frontend/vue frontend/js/workspace-model.js frontend/vendor/DEPENDENCY-MANIFEST.json frontend/sw.js
          if [[ -n "$(git status --porcelain -- frontend/vue frontend/js/workspace-model.js frontend/vendor/DEPENDENCY-MANIFEST.json frontend/sw.js)" ]]; then
            echo "Vue production build changed committed assets" >&2
            git status --porcelain -- frontend/vue frontend/js/workspace-model.js frontend/vendor/DEPENDENCY-MANIFEST.json frontend/sw.js >&2
            exit 1
          fi

      # Storybook is maintainer-only. pull_request and push build only
      # after a successful diff against a defined baseline (PR base, or a
      # fetched nonzero push before SHA) that touches frontend-app/ or this
      # workflow. A missing baseline, a failed fetch, or a failed diff fails
      # the step. A readable diff with no matching path is the only skip.
      # workflow_dispatch builds with no diff and does not invent a baseline.
      - name: Storybook build when frontend tooling changes
        shell: bash
        env:
          PRKS_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PRKS_PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          pattern='^(frontend-app/|\.github/workflows/static-analysis\.yml$)'
          zero_sha="0000000000000000000000000000000000000000"
          event_name="${{ github.event_name }}"
          run_storybook=false

          # Capture git diff before matching. Do not pipe it into grep:
          # under pipefail a SIGPIPE can look like "no match". -z keeps
          # pathnames unquoted, so a name like Café.stories.ts cannot hide
          # behind a leading quote. grep -z status 1 is "no match"; any
          # other grep failure fails the step.
          apply_successful_diff() {
            local left="$1"
            local diff_file diff_status grep_status
            diff_file="$(mktemp)"
            if git diff -z --name-only "$left" HEAD >"$diff_file"; then
              diff_status=0
            else
              diff_status=$?
            fi
            if [[ "$diff_status" -ne 0 ]]; then
              echo "Storybook path diff failed (status ${diff_status})" >&2
              rm -f "$diff_file"
              exit 1
            fi
            if grep -zEq "$pattern" "$diff_file"; then
              run_storybook=true
            else
              grep_status=$?
              if [[ "$grep_status" -ne 1 ]]; then
                echo "Storybook path match failed (status ${grep_status})" >&2
                rm -f "$diff_file"
                exit 1
              fi
            fi
            rm -f "$diff_file"
          }

          fetch_baseline() {
            local sha="$1"
            if ! git fetch --no-tags --depth=1 origin "$sha"; then
              echo "Failed to fetch Storybook diff baseline ${sha}" >&2
              exit 1
            fi
          }

          if [[ "$event_name" == "pull_request" ]]; then
            if [[ -z "${PRKS_PR_BASE_SHA:-}" ]]; then
              echo "Pull request has no base SHA; cannot resolve Storybook diff." >&2
              exit 1
            fi
            fetch_baseline "${PRKS_PR_BASE_SHA}"
            apply_successful_diff "${PRKS_PR_BASE_SHA}"
          elif [[ "$event_name" == "push" ]]; then
            if [[ -z "${PRKS_PUSH_BEFORE:-}" || "${PRKS_PUSH_BEFORE}" == "$zero_sha" ]]; then
              echo "Push before SHA is missing or zero; cannot resolve Storybook diff." >&2
              exit 1
            fi
            fetch_baseline "${PRKS_PUSH_BEFORE}"
            apply_successful_diff "${PRKS_PUSH_BEFORE}"
          elif [[ "$event_name" == "workflow_dispatch" ]]; then
            echo "Manual Fast Static Analysis run; building Storybook."
            run_storybook=true
          else
            echo "No Storybook diff baseline for event ${event_name}." >&2
            exit 1
          fi
          if [[ "$run_storybook" != "true" ]]; then
            echo "Skipping Storybook build: diff does not touch frontend-app or this workflow."
            exit 0
          fi
          npm run build-storybook --prefix frontend-app
          if [[ -e frontend/storybook-static || -e frontend/vue/index.html || -e frontend/vue/iframe.html ]]; then
            echo "Storybook wrote into the PRKS runtime tree" >&2
            exit 1
          fi
