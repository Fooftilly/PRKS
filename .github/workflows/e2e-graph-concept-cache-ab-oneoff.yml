name: Temporary Graph Concept Cache Same-Runner A/B

# One-off PR-branch diagnostic for #740. DELETE BEFORE MERGE.
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: temporary-graph-concept-cache-ab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    if: github.head_ref == 'perf/graph-concept-offline-detail-cache-740'
    name: Compare baseline and candidate on one runner (temporary)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Cache Playwright Chromium
        uses: actions/cache@9255dc7a253b0ccc959486e2bca901246202afeb # v5.0.1
        with:
          path: .playwright-browsers
          key: >-
            playwright-${{ runner.os }}-${{ hashFiles('requirements-dev.txt',
            'tests/e2e/install_browser.py') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install pinned runtime and E2E dependencies
        run: >-
          python -m pip install --isolated --disable-pip-version-check
          "--only-binary=:all:" "PyMuPDF==1.28.2" "Pillow==12.3.0" "pydantic==2.13.5"
          "playwright==1.63.0"
      - name: Ensure Chromium in repo cache
        run: python tests/e2e/install_browser.py
      - name: Compare exact refs in fresh Chromium contexts (same runner)
        shell: bash
        env:
          PRKS_E2E_PROFILE: "1"
          TARGET: tests.e2e.test_research_graph_offline.ResearchGraphOfflineTests.test_record_graph_navigation_both_directions
          BASELINE_SHA: 570239c4fd2e9a7185d88887f88122fd110bbc52
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          run_case() {
            local ref="$1" label="$2" trial="$3"
            git switch --detach "$ref" >/dev/null
            echo "::group::$label trial $trial"
            PRKS_E2E_BENCHMARK_RESULT="$RUNNER_TEMP/graph-concept-ab-$label-$trial.json" \
              python tests/e2e/run.py --jobs 1 --no-pointer-capture --profile "$TARGET"
            echo "::endgroup::"
          }
          run_case "$BASELINE_SHA" baseline warmup
          run_case "$CANDIDATE_SHA" candidate warmup
          for trial in 1 2 3; do
            run_case "$BASELINE_SHA" baseline "$trial"
            run_case "$CANDIDATE_SHA" candidate "$trial"
          done
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from statistics import median

          root = Path(os.environ["RUNNER_TEMP"])
          samples = {}
          phases = [
              "graph_nav_roundtrip_1_concept",
              "graph_nav_stage_1_concept_enter",
              "graph_nav_stage_1_concept_to_graph",
              "graph_nav_stage_1_concept_return",
              "graph_nav_roundtrip_2_position",
              "graph_nav_stage_2_position_enter",
              "graph_nav_stage_2_position_to_graph",
              "graph_nav_stage_2_position_return",
              "graph_nav_uncached_destination",
              "graph_nav_uncached_graph",
          ]
          for label in ("baseline", "candidate"):
              samples[label] = [
                  json.loads((root / f"graph-concept-ab-{label}-{i}.json").read_text())
                  for i in (1, 2, 3)
              ]
              for i, data in enumerate(samples[label], 1):
                  if any(data.get(k) != v for k, v in (
                      ("tests", 1), ("failures", 0), ("errors", 0), ("skipped", 0)
                  )):
                      raise SystemExit(f"{label} trial {i} was not one passing test")
                  seen = data.get("phase_seconds") or {}
                  missing = set(phases) - seen.keys()
                  failed = [k for k in seen if k.startswith("graph_nav_") and k.endswith("_failed")]
                  if missing or failed:
                      raise SystemExit(f"{label} trial {i}: missing={sorted(missing)}, failures={failed}")
          lines = [
              "## Same-runner Graph Concept offline cache A/B (three trials each)",
              "",
              "Exact baseline is the pre-change master commit; candidate is PR head.",
              "Both run on the same GitHub runner with fresh browser/storage per trial.",
              "A separate warm-up for each, then alternating baseline/candidate.",
              "All times are profiled: parent and nested intervals overlap.",
              "",
              "| Phase | Baseline median (s) | Candidate median (s) | Change (s) |",
              "| --- | ---: | ---: | ---: |",
          ]
          for name in ("wall_seconds", *phases):
              def median_for(label):
                  values = [
                      float(d["wall_seconds"] if name == "wall_seconds"
                            else d["phase_seconds"][name])
                      for d in samples[label]
                  ]
                  return median(values)
              base, candidate = median_for("baseline"), median_for("candidate")
              lines.append(f"| `{name}` | {base:.3f} | {candidate:.3f} | {candidate-base:+.3f} |")
          lines.extend(["", "Negative change is faster; neither equivalence nor gain should",
                        "be inferred without checking full correctness gates."])
          report = "\n".join(lines) + "\n"
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fd:
              fd.write(report)
          PY
