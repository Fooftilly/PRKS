name: Temporary Vue source artifact refresh for PR 1093

on:
  push:
    branches:
      - chatgpt/unsent-claim-offline-race-1091
    paths:
      - .github/workflows/prks-vue-refresh-1093.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'Fooftilly/PRKS' && github.ref == 'refs/heads/chatgpt/unsent-claim-offline-race-1091'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chatgpt/unsent-claim-offline-race-1091
          persist-credentials: true
      - name: Use pinned Node major
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Build canonical committed Vue artifacts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix frontend-app --ignore-scripts
          npm run build --prefix frontend-app
          git add -- frontend/vue frontend/vendor/DEPENDENCY-MANIFEST.json frontend/sw.js
          # One-shot helper must never remain in the final PR tree.
          git rm -- .github/workflows/prks-vue-refresh-1093.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'build(vue): refresh committed bundle after transport generation fix'
          git push origin HEAD:refs/heads/chatgpt/unsent-claim-offline-race-1091
