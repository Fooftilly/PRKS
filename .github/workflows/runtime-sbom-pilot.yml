name: Runtime image SBOM and Grype pilot (advisory)

# Bounded pilot: run manually or on actual runtime packaging inputs.
# Source-only/backend/frontend edits do not trigger expensive container builds.
# Advisory only; no release upload or required policy.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/runtime-sbom-pilot.yml"
      - "Dockerfile"
      - "docker-entrypoint.sh"
      - "requirements.txt"
      - "dependency-inventory.json"
      - "scripts/ci/summarize_runtime_sbom.py"
      - "tests/test_runtime_sbom_summary.py"

permissions:
  contents: read

concurrency:
  group: runtime-sbom-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-sbom:
    name: Built runtime image Syft/Grype
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Scan only a local built runtime image, not source dependencies.
      # The runtime Dockerfile omits test tooling and Node/npm.
      - name: Build a disposable local PRKS runtime image
        run: docker build --pull --tag prks-sbom-pilot:local --file Dockerfile .

      - name: Record exact built image identity
        shell: bash
        run: docker image inspect --format '{{.Id}}' prks-sbom-pilot:local > "$RUNNER_TEMP/prks-runtime-image-id.txt"

      - name: Export SPDX SBOM from built image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: prks-sbom-pilot:local
          syft-version: v1.42.3
          format: spdx-json
          output-file: ${{ runner.temp }}/prks-runtime.spdx.json
          artifact-name: prks-runtime-sbom
          upload-artifact: true
          upload-artifact-retention: 7
          upload-release-assets: false
          dependency-snapshot: false

      - name: Scan the exported SBOM with Grype (advisory vulnerabilities)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: ${{ runner.temp }}/prks-runtime.spdx.json
          grype-version: v0.121.0
          fail-build: false
          output-format: json
          output-file: ${{ runner.temp }}/prks-runtime.grype.json

      - name: Validate and summarize runtime vulnerability signals
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python3 "$GITHUB_WORKSPACE/scripts/ci/summarize_runtime_sbom.py"
          cat "$RUNNER_TEMP/prks-runtime-triage.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Grype advisory report
        # Preserve diagnosis on scan/validation failure when Grype produced JSON.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prks-runtime-grype-advisory
          path: |
            ${{ runner.temp }}/prks-runtime.grype.json
            ${{ runner.temp }}/prks-runtime-image-id.txt
            ${{ runner.temp }}/prks-runtime-triage.json
          retention-days: 7
          if-no-files-found: warn
