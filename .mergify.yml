# PRKS Mergify configuration. Introduce rules only through reviewed PRs.
# PRKS requires explicit maintainer approval for every merge.
# Mergify must not automatically merge, queue, rebase, retry, or quarantine PRs.
# Merge Queue is disabled in the Mergify dashboard. This YAML cannot enforce
# that product setting: leave Merge Queue disabled to preserve manual merges.

# Merge Protections is active. Report via GitHub checks, without comments.
# Do not set auto_merge_conditions here or turn on Mergify Workflow Automation.
merge_protections_settings:
  reporting_method: check-runs
  post_comment: false

# Retain this harmless preference if Merge Queue is ever re-enabled.
# It only hides queue-control comments; it does not prevent queue commands.
merge_queue:
  queue_controls_comment: false

# These checks become merge-blocking only once the Mergify Merge Protections
# status check is required in GitHub's active master ruleset.
# Existing GitHub checks and native Mergify Depends-On/Merge-After remain intact.
merge_protections:
  - name: PRKS / No unfinished pull request titles
    description: >-
      A PR marked WIP, DNM, or DO NOT MERGE should not be considered ready
      even if it was accidentally converted out of draft.
    if:
      - base = master
    success_conditions:
      - '-title ~= (?i)(^|[^a-z])(wip|dnm|do[\s_-]+not[\s_-]+merge)([^a-z]|$)'
